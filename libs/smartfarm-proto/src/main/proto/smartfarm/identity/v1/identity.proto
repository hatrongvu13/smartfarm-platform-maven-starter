syntax = "proto3";

package smartfarm.identity.v1;

option java_package = "com.htv.smartfarm.proto.identity.v1";
option java_multiple_files = true;
option java_outer_classname = "IdentityProto";

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "smartfarm/common/v1/common.proto";

// ============================================================
// IDENTITY DIRECTORY
// ============================================================
//
// Contract nội bộ phục vụ tra cứu principal, cập nhật profile
// và kiểm tra quyền.
//
// Service này không phát hành access token, refresh token,
// authorization code hoặc thay thế các endpoint OAuth2/OIDC.
service IdentityDirectoryService {

  rpc GetPrincipal(GetPrincipalRequest)
      returns (GetPrincipalResponse);

  rpc UpdatePrincipalProfile(UpdatePrincipalProfileRequest)
      returns (UpdatePrincipalProfileResponse);

  rpc CheckPermission(CheckPermissionRequest)
      returns (CheckPermissionResponse);

  rpc BatchCheckPermissions(BatchCheckPermissionsRequest)
      returns (BatchCheckPermissionsResponse);

  rpc Ping(smartfarm.common.v1.PingRequest)
      returns (smartfarm.common.v1.PingResponse);
}

// ============================================================
// TENANT IDENTITY ADMINISTRATION
// ============================================================
//
// Quản trị người dùng, membership, role và permission trong
// tenant đã được xác thực.
//
// tenant_id trong RequestContext phải được đối chiếu với tenant
// trong JWT bởi gRPC interceptor hoặc application security.
service IdentityAdministrationService {

  // Liệt kê role khả dụng trong tenant cùng permission được cấp.
  rpc ListRoles(ListRolesRequest)
      returns (ListRolesResponse);

  // Lấy chi tiết một role trong tenant.
  rpc GetRole(GetRoleRequest)
      returns (GetRoleResponse);

  // Liệt kê permission catalog mà tenant có thể sử dụng.
  rpc ListPermissions(ListPermissionsRequest)
      returns (ListPermissionsResponse);

  // Liệt kê người dùng và membership của tenant.
  rpc ListUsers(ListUsersRequest)
      returns (ListUsersResponse);

  // Lấy account, membership, role và effective permission
  // của một người dùng trong tenant.
  rpc GetUserAuthorization(GetUserAuthorizationRequest)
      returns (GetUserAuthorizationResponse);

  // Tạo account mới hoặc liên kết account hiện có vào tenant.
  rpc CreateUser(CreateUserRequest)
      returns (CreateUserResponse);

  // Gán role thuộc tenant cho membership.
  rpc AssignRole(AssignRoleRequest)
      returns (AssignRoleResponse);

  // Gỡ role khỏi membership.
  rpc RevokeRole(RevokeRoleRequest)
      returns (RevokeRoleResponse);

  // Vô hiệu hóa membership trong tenant hiện tại.
  // Không vô hiệu hóa account toàn cục.
  rpc DisableMembership(DisableMembershipRequest)
      returns (UpdateMembershipStatusResponse);

  // Kích hoạt lại membership trong tenant hiện tại.
  rpc EnableMembership(EnableMembershipRequest)
      returns (UpdateMembershipStatusResponse);

  // Tạm ngưng membership trong tenant hiện tại.
  rpc SuspendMembership(SuspendMembershipRequest)
      returns (UpdateMembershipStatusResponse);

  rpc CreateTenantRole(CreateTenantRoleRequest) returns (RoleMutationResponse);
  rpc UpdateTenantRole(UpdateTenantRoleRequest) returns (RoleMutationResponse);
  rpc DeleteTenantRole(DeleteTenantRoleRequest) returns (DeleteAuthorizationObjectResponse);
  rpc CreatePermission(CreatePermissionRequest) returns (PermissionMutationResponse) {
    option deprecated = true;
  }
  rpc UpdatePermission(UpdatePermissionRequest) returns (PermissionMutationResponse) {
    option deprecated = true;
  }
  rpc DeletePermission(DeletePermissionRequest) returns (DeleteAuthorizationObjectResponse) {
    option deprecated = true;
  }
  rpc GrantPermissionToRole(TenantRolePermissionRequest) returns (RoleMutationResponse);
  rpc UpdateUserProfileAsAdministrator(AdminUpdateUserProfileRequest) returns (AdminUserPrincipalResponse);
  rpc DisableUserAccount(AccountAdministrationRequest) returns (GetUserAuthorizationResponse);
  rpc EnableUserAccount(AccountAdministrationRequest) returns (GetUserAuthorizationResponse);
  rpc UnlockUserAccount(AccountAdministrationRequest) returns (GetUserAuthorizationResponse);
  rpc RevokePermissionFromRole(TenantRolePermissionRequest) returns (RoleMutationResponse);
}

// ============================================================
// PLATFORM AUTHORIZATION ADMINISTRATION
// ============================================================
//
// Chỉ dành cho platform administrator.
//
// Service này quản trị từ vựng permission và role template
// cấp hệ thống. Không sử dụng cho tenant administrator.
service PlatformAuthorizationAdministrationService {

  rpc ListPlatformRoles(ListPlatformRolesRequest)
      returns (ListPlatformRolesResponse);

  rpc CreatePlatformRole(CreatePlatformRoleRequest)
      returns (CreatePlatformRoleResponse);

  rpc GrantPlatformPermission(GrantPlatformPermissionRequest)
      returns (GrantPlatformPermissionResponse);

  rpc RevokePlatformPermission(RevokePlatformPermissionRequest)
      returns (RevokePlatformPermissionResponse);

  // Global platform-owned permission catalog.
  rpc GetGlobalPermission(GetGlobalPermissionRequest)
      returns (GetGlobalPermissionResponse);

  rpc CreateGlobalPermission(CreateGlobalPermissionRequest)
      returns (GlobalPermissionMutationResponse);

  rpc UpdateGlobalPermission(UpdateGlobalPermissionRequest)
      returns (GlobalPermissionMutationResponse);

  rpc DeleteGlobalPermission(DeleteGlobalPermissionRequest)
      returns (DeleteAuthorizationObjectResponse);
}

// ============================================================
// ENUMS
// ============================================================

enum MembershipStatus {
  MEMBERSHIP_STATUS_UNSPECIFIED = 0;
  MEMBERSHIP_STATUS_INVITED = 1;
  MEMBERSHIP_STATUS_ACTIVE = 2;
  MEMBERSHIP_STATUS_SUSPENDED = 3;
  MEMBERSHIP_STATUS_DISABLED = 4;
}

enum RoleType {
  ROLE_TYPE_UNSPECIFIED = 0;

  // Role thuộc một tenant cụ thể.
  ROLE_TYPE_TENANT = 1;

  // Role do hệ thống cung cấp, tenant không được sửa.
  ROLE_TYPE_SYSTEM = 2;

  // Role cấp platform, không được gán qua tenant API.
  ROLE_TYPE_PLATFORM = 3;
}

enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  ACCOUNT_STATUS_ACTIVE = 1;
  ACCOUNT_STATUS_LOCKED = 2;
  ACCOUNT_STATUS_DISABLED = 3;
}

// ============================================================
// DIRECTORY MODELS
// ============================================================

message PrincipalProfile {
  string display_name = 1;
  string email = 2;
  string phone_number = 3;
  string locale = 4;
  string time_zone = 5;

  string first_name = 6;
  string last_name = 7;
  string avatar_url = 8;
  string country_code = 9;
  string address = 10;

  bool email_verified = 11;
  bool phone_verified = 12;
}

message TenantMembership {
  string membership_id = 1;
  string tenant_id = 2;
  MembershipStatus status = 3;
  repeated string roles = 4;
  repeated string farm_ids = 5;
}

message Principal {
  // Stable OAuth2/OIDC subject.
  string subject_id = 1;

  PrincipalProfile profile = 2;

  // Trạng thái account toàn cục.
  bool active = 3;

  // Membership của tenant được yêu cầu.
  TenantMembership membership = 4;

  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;

  // Optimistic locking version của profile.
  int64 version = 7;
}

message GetPrincipalRequest {
  smartfarm.common.v1.RequestContext context = 1;

  // Nếu rỗng, server sử dụng subject đã xác thực.
  string subject_id = 2;
}

message GetPrincipalResponse {
  Principal principal = 1;
}

message UpdatePrincipalProfileRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string subject_id = 2;
  PrincipalProfile profile = 3;
  google.protobuf.FieldMask update_mask = 4;

  // Dùng optional để phân biệt không gửi và gửi giá trị 0.
  optional int64 expected_version = 5;
}

message UpdatePrincipalProfileResponse {
  Principal principal = 1;
}

message PermissionTarget {
  string resource_type = 1;
  string resource_id = 2;
  string action = 3;
}

message CheckPermissionRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string subject_id = 2;
  PermissionTarget target = 3;
}

message CheckPermissionResponse {
  bool allowed = 1;
  string reason_code = 2;
}

message BatchCheckPermissionsRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string subject_id = 2;
  repeated PermissionTarget targets = 3;
}

message PermissionDecision {
  PermissionTarget target = 1;
  bool allowed = 2;
  string reason_code = 3;
}

message BatchCheckPermissionsResponse {
  repeated PermissionDecision decisions = 1;
}

// ============================================================
// AUTHORIZATION CATALOG MODELS
// ============================================================

message PermissionInfo {
  string code = 1;
  string resource_type = 2;
  string action = 3;
  string description = 4;
}

message RoleInfo {
  string role_id = 1;
  string tenant_id = 2;
  string code = 3;
  string name = 4;
  RoleType type = 5;
  repeated PermissionInfo permissions = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  int64 version = 9;
}

// ============================================================
// USER ADMINISTRATION MODELS
// ============================================================

message UserSummary {
  string subject_id = 1;
  string membership_id = 2;
  string tenant_id = 3;
  string email = 4;
  string display_name = 5;
  AccountStatus account_status = 6;
  MembershipStatus membership_status = 7;
  repeated string roles = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message UserAuthorization {
  string subject_id = 1;
  string membership_id = 2;
  string tenant_id = 3;
  AccountStatus account_status = 4;
  MembershipStatus membership_status = 5;
  repeated RoleInfo roles = 6;
  repeated PermissionInfo effective_permissions = 7;
  repeated string farm_ids = 8;
}

// ============================================================
// ROLE QUERIES
// ============================================================

message ListRolesRequest {
  smartfarm.common.v1.RequestContext context = 1;
  smartfarm.common.v1.PageRequest page = 2;

  // Nếu true, response chứa permission của từng role.
  bool include_permissions = 3;
}

message ListRolesResponse {
  repeated RoleInfo roles = 1;
  smartfarm.common.v1.PageResponse page = 2;
}

message GetRoleRequest {
  smartfarm.common.v1.RequestContext context = 1;

  oneof identifier {
    string role_id = 2;
    string role_code = 3;
  }
}

message GetRoleResponse {
  RoleInfo role = 1;
}

// ============================================================
// PERMISSION QUERIES
// ============================================================

message ListPermissionsRequest {
  smartfarm.common.v1.RequestContext context = 1;
  smartfarm.common.v1.PageRequest page = 2;

  // Tùy chọn lọc theo resource type.
  string resource_type = 3;
}

message ListPermissionsResponse {
  repeated PermissionInfo permissions = 1;
  smartfarm.common.v1.PageResponse page = 2;
}

// ============================================================
// USER QUERIES
// ============================================================

message ListUsersRequest {
  smartfarm.common.v1.RequestContext context = 1;
  smartfarm.common.v1.PageRequest page = 2;

  // Tìm kiếm theo email hoặc display name.
  string search_text = 3;

  // Nếu UNSPECIFIED thì không lọc theo trạng thái.
  MembershipStatus membership_status = 4;

  // Tùy chọn lọc user có role này.
  string role_code = 5;
}

message ListUsersResponse {
  repeated UserSummary users = 1;
  smartfarm.common.v1.PageResponse page = 2;
}

message GetUserAuthorizationRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string subject_id = 2;
}

message GetUserAuthorizationResponse {
  UserAuthorization authorization = 1;
}

// ============================================================
// CREATE USER
// ============================================================

message CreateUserRequest {
  smartfarm.common.v1.RequestContext context = 1;

  string email = 2;

  // Credential nhạy cảm.
  //
  // Chỉ sử dụng trên TLS/mTLS, không log request payload và
  // không lưu plaintext.
  string initial_password = 3;

  string display_name = 4;
  string phone_number = 5;
  string locale = 6;
  string time_zone = 7;

  // Role mặc định, ví dụ USER.
  // Nếu rỗng, application service áp dụng role mặc định.
  repeated string initial_role_codes = 8;

  // Nếu true, membership được ACTIVE ngay.
  // Nếu false, membership bắt đầu ở trạng thái INVITED.
  bool activate_immediately = 9;
}

message CreateUserResponse {
  string subject_id = 1;
  string membership_id = 2;
  string tenant_id = 3;
  MembershipStatus membership_status = 4;

  // True nếu account đã tồn tại và chỉ tạo thêm membership.
  bool existing_account = 5;
}

// ============================================================
// ROLE ASSIGNMENT
// ============================================================

message AssignRoleRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string subject_id = 2;
  string role_code = 3;
}

message AssignRoleResponse {
  string subject_id = 1;
  string membership_id = 2;
  string tenant_id = 3;
  repeated string role_codes = 4;
}

message RevokeRoleRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string subject_id = 2;
  string role_code = 3;
}

message RevokeRoleResponse {
  string subject_id = 1;
  string membership_id = 2;
  string tenant_id = 3;
  repeated string role_codes = 4;
}

// ============================================================
// MEMBERSHIP STATUS
// ============================================================

message DisableMembershipRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string subject_id = 2;
  string reason = 3;
}

message EnableMembershipRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string subject_id = 2;
}

message SuspendMembershipRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string subject_id = 2;
  string reason = 3;
}

message UpdateMembershipStatusResponse {
  string subject_id = 1;
  string membership_id = 2;
  string tenant_id = 3;
  MembershipStatus status = 4;
  google.protobuf.Timestamp updated_at = 5;
}

// ============================================================
// DYNAMIC TENANT AUTHORIZATION ADMINISTRATION
// ============================================================
message CreateTenantRoleRequest { smartfarm.common.v1.RequestContext context = 1; string code = 2; string name = 3; }
message UpdateTenantRoleRequest { smartfarm.common.v1.RequestContext context = 1; string code = 2; string name = 3; }
message DeleteTenantRoleRequest { smartfarm.common.v1.RequestContext context = 1; string code = 2; }
message RoleMutationResponse { RoleInfo role = 1; }
message CreatePermissionRequest { smartfarm.common.v1.RequestContext context = 1; string code = 2; string resource_type = 3; string action = 4; string description = 5; }
message UpdatePermissionRequest { smartfarm.common.v1.RequestContext context = 1; string code = 2; string resource_type = 3; string action = 4; string description = 5; }
message DeletePermissionRequest { smartfarm.common.v1.RequestContext context = 1; string code = 2; }
message PermissionMutationResponse { PermissionInfo permission = 1; }
message TenantRolePermissionRequest { smartfarm.common.v1.RequestContext context = 1; string role_code = 2; string permission_code = 3; }
message DeleteAuthorizationObjectResponse { bool deleted = 1; }

// ============================================================
// SUPERADMIN USER ADMINISTRATION
// ============================================================
message AdminUpdateUserProfileRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string subject_id = 2;
  PrincipalProfile profile = 3;
  google.protobuf.FieldMask update_mask = 4;
  optional int64 expected_version = 5;
}
message AdminUserPrincipalResponse { Principal principal = 1; }
message AccountAdministrationRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string subject_id = 2;
  string reason = 3;
}

// ============================================================
// PLATFORM ROLE ADMINISTRATION
// ============================================================

message ListPlatformRolesRequest {
  smartfarm.common.v1.RequestContext context = 1;
  smartfarm.common.v1.PageRequest page = 2;
  bool include_permissions = 3;
}

message ListPlatformRolesResponse {
  repeated RoleInfo roles = 1;
  smartfarm.common.v1.PageResponse page = 2;
}

message CreatePlatformRoleRequest {
  smartfarm.common.v1.RequestContext context = 1;

  // Pattern đề xuất: [A-Z][A-Z0-9_]{1,39}
  string role_code = 2;

  string role_name = 3;
  string description = 4;

  repeated string permission_codes = 5;
}

message CreatePlatformRoleResponse {
  RoleInfo role = 1;
}

message GrantPlatformPermissionRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string role_code = 2;
  string permission_code = 3;
}

message GrantPlatformPermissionResponse {
  RoleInfo role = 1;
}

message RevokePlatformPermissionRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string role_code = 2;
  string permission_code = 3;
}

message RevokePlatformPermissionResponse {
  RoleInfo role = 1;
}

message GetGlobalPermissionRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string permission_code = 2;
}

message GetGlobalPermissionResponse {
  PermissionInfo permission = 1;
}

message CreateGlobalPermissionRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string code = 2;
  string resource_type = 3;
  string action = 4;
  string description = 5;
}

message UpdateGlobalPermissionRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string code = 2;
  string resource_type = 3;
  string action = 4;
  string description = 5;
  optional int64 expected_version = 6;
}

message DeleteGlobalPermissionRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string code = 2;
  optional int64 expected_version = 3;
}

message GlobalPermissionMutationResponse {
  PermissionInfo permission = 1;
  int64 version = 2;
}


// ============================================================
// IDENTITY CREDENTIAL MANAGEMENT
// ============================================================

service IdentityCredentialService {
  rpc GetSecurityProfile(GetSecurityProfileRequest)
      returns (GetSecurityProfileResponse);

  rpc BeginTotpEnrollment(BeginTotpEnrollmentRequest)
      returns (BeginTotpEnrollmentResponse);

  rpc ConfirmTotpEnrollment(ConfirmTotpEnrollmentRequest)
      returns (ConfirmTotpEnrollmentResponse);

  rpc DisableOwnMfa(DisableOwnMfaRequest)
      returns (DisableOwnMfaResponse);

  rpc RegenerateRecoveryCodes(RegenerateRecoveryCodesRequest)
      returns (RegenerateRecoveryCodesResponse);

  rpc ResetUserMfa(ResetUserMfaRequest)
      returns (ResetUserMfaResponse);

  rpc ChangeOwnPassword(ChangeOwnPasswordRequest)
      returns (ChangeOwnPasswordResponse);
}

message AuthenticatorInfo {
  string authenticator_id = 1;
  string type = 2;
  string status = 3;
  string display_name = 4;
}

message SecurityProfileInfo {
  string subject_id = 1;
  bool totp_required = 2;
  bool totp_enabled = 3;
  repeated AuthenticatorInfo authenticators = 4;
}

message GetSecurityProfileRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string subject_id = 2;
}

message GetSecurityProfileResponse {
  SecurityProfileInfo security_profile = 1;
}

message BeginTotpEnrollmentRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string subject_id = 2;
  string display_name = 3;
}

message BeginTotpEnrollmentResponse {
  string authenticator_id = 1;
  string otpauth_uri = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message ConfirmTotpEnrollmentRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string subject_id = 2;
  string authenticator_id = 3;
  string code = 4;
}

message ConfirmTotpEnrollmentResponse {
  string authenticator_id = 1;
  repeated string recovery_codes = 2;
}

message DisableOwnMfaRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string subject_id = 2;
  string authenticator_id = 3;
}

message DisableOwnMfaResponse {
  bool disabled = 1;
}

message RegenerateRecoveryCodesRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string subject_id = 2;
  string authenticator_id = 3;
}

message RegenerateRecoveryCodesResponse {
  repeated string recovery_codes = 1;
}

message ResetUserMfaRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string subject_id = 2;
}

message ResetUserMfaResponse {
  bool reset = 1;
}

message ChangeOwnPasswordRequest {
  smartfarm.common.v1.RequestContext context = 1;
  string subject_id = 2;
  string current_password = 3;
  string new_password = 4;
}

message ChangeOwnPasswordResponse {
  bool changed = 1;
}

// ============================================================
// INTERNAL TOKEN AND SESSION MANAGEMENT
// ============================================================
//
// Contract nội bộ dành cho việc cấp service token,
// delegated service token và quản lý refresh session.
//
// Service này không thay thế các endpoint public authentication,
// OAuth2/OIDC hoặc các RPC directory/administration hiện có.
//
// Các RPC cấp token phải được bảo vệ bằng service identity,
// mTLS hoặc cơ chế xác thực nội bộ tương đương.
//
// Không ghi client_secret, access_token hoặc refresh token
// vào application log, audit log hay integration event.
service IdentityTokenService {

  // Cấp service token thông thường cho một machine client.
  //
  // Client chỉ được yêu cầu audience đã được cấu hình trong
  // allowlist và chỉ nhận các scope đã được cấp cho audience đó.
  rpc IssueServiceToken(IssueServiceTokenRequest)
      returns (TokenGrantResponse);

  // Cấp service token có delegated actor.
  //
  // Identity phải xác minh:
  // - Client được phép delegation.
  // - Actor account đang hoạt động.
  // - Actor membership đang ACTIVE trong tenant.
  // - Audience thuộc allowlist của client.
  // - Authorization versions hiện tại của actor.
  rpc ExchangeDelegatedToken(ExchangeDelegatedTokenRequest)
      returns (TokenGrantResponse);

  // Liệt kê các refresh session của một người dùng.
  //
  // Response không được chứa refresh token hoặc token hash.
  rpc ListSessions(ListSessionsRequest)
      returns (ListSessionsResponse);

  // Thu hồi một refresh session cụ thể.
  rpc RevokeSession(RevokeSessionRequest)
      returns (RevokeSessionResponse);

  // Thu hồi toàn bộ refresh session của người dùng
  // trong phạm vi tenant hiện tại.
  rpc RevokeAllSessions(RevokeAllSessionsRequest)
      returns (RevokeAllSessionsResponse);
}

// ============================================================
// SERVICE TOKEN
// ============================================================

message IssueServiceTokenRequest {
  smartfarm.common.v1.RequestContext context = 1;

  // Machine client đã được đăng ký trong Identity.
  string client_id = 2;

  // Credential nhạy cảm.
  //
  // Chỉ sử dụng trên TLS/mTLS.
  // Không log request payload hoặc giá trị trường này.
  string client_secret = 3;

  // Service audience mà client muốn gọi.
  //
  // Audience phải nằm trong allowlist của client.
  string audience = 4;
}

message ExchangeDelegatedTokenRequest {
  smartfarm.common.v1.RequestContext context = 1;

  // Machine client đã được đăng ký trong Identity.
  string client_id = 2;

  // Credential nhạy cảm.
  //
  // Chỉ sử dụng trên TLS/mTLS.
  // Không log request payload hoặc giá trị trường này.
  string client_secret = 3;

  // Service audience mà client muốn gọi.
  string audience = 4;

  // Stable subject ID của người dùng được ủy quyền.
  //
  // Giá trị này phải được Identity xác minh lại với account,
  // membership và authorization versions hiện tại.
  string actor_subject_id = 5;
}

message TokenGrantResponse {
  // JWT đã được Identity ký.
  string access_token = 1;

  // Giá trị hiện tại là "Bearer".
  string token_type = 2;

  // Thời gian sống còn lại của token tính bằng giây.
  int64 expires_in_seconds = 3;

  // Audience thực tế ghi trong token.
  string audience = 4;
}

// ============================================================
// REFRESH SESSION MANAGEMENT
// ============================================================

message SessionInfo {
  // Stable identifier của refresh session.
  string session_id = 1;

  // Người dùng sở hữu session.
  string subject_id = 2;

  // Tenant mà session thuộc về.
  string tenant_id = 3;

  // Audience được phép khi rotate session.
  string audience = 4;

  google.protobuf.Timestamp created_at = 5;

  // Thời điểm session hoặc refresh token gần nhất được sử dụng.
  //
  // Có thể không được thiết lập nếu session chưa từng rotate.
  google.protobuf.Timestamp last_used_at = 6;

  google.protobuf.Timestamp expires_at = 7;

  // Chỉ có giá trị khi session đã bị thu hồi.
  google.protobuf.Timestamp revoked_at = 8;

  // Mã hoặc mô tả ngắn cho nguyên nhân thu hồi.
  string revoke_reason = 9;
}

message ListSessionsRequest {
  smartfarm.common.v1.RequestContext context = 1;

  // Nếu rỗng, sử dụng verified actor từ security context.
  //
  // Chỉ administrator có authority phù hợp mới được tra cứu
  // session của subject khác.
  string subject_id = 2;
}

message ListSessionsResponse {
  repeated SessionInfo sessions = 1;
}

message RevokeSessionRequest {
  smartfarm.common.v1.RequestContext context = 1;

  // Subject sở hữu session.
  //
  // Nếu rỗng, sử dụng verified actor từ security context.
  string subject_id = 2;

  string session_id = 3;

  // Lý do thu hồi phục vụ audit.
  string reason = 4;
}

message RevokeSessionResponse {
  // True nếu session tồn tại và được thu hồi bởi request này.
  //
  // False nếu session đã bị thu hồi trước đó hoặc không có
  // thay đổi trạng thái.
  bool revoked = 1;
}

message RevokeAllSessionsRequest {
  smartfarm.common.v1.RequestContext context = 1;

  // Subject cần thu hồi toàn bộ session.
  //
  // Nếu rỗng, sử dụng verified actor từ security context.
  string subject_id = 2;

  // Lý do thu hồi phục vụ audit.
  string reason = 3;
}

message RevokeAllSessionsResponse {
  // Số session thực sự chuyển sang trạng thái revoked.
  int32 revoked_count = 1;
}