syntax = "proto3";
package smartfarm.readiness.v1;
option java_package = "com.htv.smartfarm.proto.readiness.v1";
option java_multiple_files = true;
option java_outer_classname = "ReadinessProto";
import "smartfarm/common/v1/common.proto";
import "google/protobuf/timestamp.proto";
// Aggregated platform readiness; standard grpc.health.v1.Health remains the per-server probe.
service PlatformReadinessService { rpc GetPlatformReadiness(GetPlatformReadinessRequest) returns (GetPlatformReadinessResponse); }
enum ComponentStatus { COMPONENT_STATUS_UNSPECIFIED = 0; COMPONENT_STATUS_READY = 1; COMPONENT_STATUS_DEGRADED = 2; COMPONENT_STATUS_NOT_READY = 3; }
message ComponentHealth { string service_name = 1; ComponentStatus status = 2; string version = 3; string detail = 4; google.protobuf.Timestamp checked_at = 5; }
message GetPlatformReadinessRequest { smartfarm.common.v1.RequestContext context = 1; string farm_id = 2; }
message GetPlatformReadinessResponse { ComponentStatus overall = 1; repeated ComponentHealth components = 2; google.protobuf.Timestamp checked_at = 3; }
