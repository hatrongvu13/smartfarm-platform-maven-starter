syntax = "proto3";
package smartfarm.inventory.v1;
option java_package = "com.htv.smartfarm.proto.inventory.v1";
option java_multiple_files = true;
option java_outer_classname = "InventoryProto";
import "smartfarm/common/v1/common.proto";
import "google/protobuf/timestamp.proto";
service InventoryService {
 rpc CreateItem(CreateItemRequest) returns (ItemResponse);
 rpc UpdateItem(UpdateItemRequest) returns (ItemResponse);
 rpc SetItemStatus(SetItemStatusRequest) returns (ItemResponse);
 rpc UpdateWarehouse(UpdateWarehouseRequest) returns (WarehouseResponse);
 rpc SetWarehouseStatus(SetWarehouseStatusRequest) returns (WarehouseResponse);
 rpc GetItem(GetItemRequest) returns (ItemResponse);
 rpc ListItems(ListItemsRequest) returns (ListItemsResponse);
 rpc CreateWarehouse(CreateWarehouseRequest) returns (WarehouseResponse);
 rpc GetWarehouse(GetWarehouseRequest) returns (WarehouseResponse);
 rpc ListWarehouses(ListWarehousesRequest) returns (ListWarehousesResponse);
 rpc ListWarehouseItems(ListWarehouseItemsRequest) returns (ListWarehouseItemsResponse);
 rpc ReceiveStock(ReceiveStockRequest) returns (StockMovementResponse);
 rpc IssueStock(IssueStockRequest) returns (StockMovementResponse);
 rpc AdjustStock(AdjustStockRequest) returns (StockMovementResponse);
 rpc ReserveStock(ReserveStockRequest) returns (ReservationResponse);
 rpc ReleaseReservation(ReleaseReservationRequest) returns (ReservationResponse);
 rpc CommitReservation(CommitReservationRequest) returns (StockMovementResponse);
 rpc GetStockBalance(GetStockBalanceRequest) returns (StockBalanceResponse);
 rpc ListLowStock(ListLowStockRequest) returns (ListLowStockResponse);
 rpc TraceLot(TraceLotRequest) returns (TraceLotResponse);
}
enum ItemCategory { ITEM_CATEGORY_UNSPECIFIED=0; ITEM_CATEGORY_FEED=1; ITEM_CATEGORY_MEDICINE=2; ITEM_CATEGORY_EQUIPMENT=3; ITEM_CATEGORY_OTHER=4; }
enum ItemStatus { ITEM_STATUS_UNSPECIFIED=0; ITEM_STATUS_ACTIVE=1; ITEM_STATUS_INACTIVE=2; }
enum WarehouseStatus { WAREHOUSE_STATUS_UNSPECIFIED=0; WAREHOUSE_STATUS_ACTIVE=1; WAREHOUSE_STATUS_INACTIVE=2; }
enum MovementType { MOVEMENT_TYPE_UNSPECIFIED=0; MOVEMENT_TYPE_RECEIPT=1; MOVEMENT_TYPE_ISSUE=2; MOVEMENT_TYPE_ADJUSTMENT=3; MOVEMENT_TYPE_RESERVATION_COMMIT=4; }
enum ReservationStatus { RESERVATION_STATUS_UNSPECIFIED=0; RESERVATION_STATUS_ACTIVE=1; RESERVATION_STATUS_RELEASED=2; RESERVATION_STATUS_COMMITTED=3; RESERVATION_STATUS_EXPIRED=4; }
message InventoryItem { string item_id=1; string sku=2; string name=3; ItemCategory category=4; string unit=5; smartfarm.common.v1.Quantity reorder_threshold=6;  ItemStatus status=7; }
message Warehouse { string warehouse_id=1; string farm_id=2; string code=3; string name=4; string description=5; string address=6; WarehouseStatus status=7; google.protobuf.Timestamp created_at=8; google.protobuf.Timestamp updated_at=9; int64 version=10; }
message WarehouseStockItem { string warehouse_id=1; string item_id=2; string sku=3; string item_name=4; ItemCategory category=5; string unit=6; smartfarm.common.v1.Quantity on_hand=7; smartfarm.common.v1.Quantity reserved=8; smartfarm.common.v1.Quantity available=9; smartfarm.common.v1.Quantity reorder_threshold=10; bool low_stock=11; int64 lot_count=12; }
message StockLot { string lot_id=1; string item_id=2; string supplier_id=3; string supplier_lot_code=4; google.protobuf.Timestamp expires_at=5; string farm_id=6; string warehouse_id=7; }
message StockMovement { string movement_id=1; string item_id=2; string lot_id=3; string warehouse_id=4; MovementType type=5; smartfarm.common.v1.Quantity quantity=6; string reference_type=7; string reference_id=8; google.protobuf.Timestamp occurred_at=9; }
message StockReservation { string reservation_id=1; string order_id=2; string item_id=3; string lot_id=4; string warehouse_id=5; smartfarm.common.v1.Quantity quantity=6; ReservationStatus status=7; google.protobuf.Timestamp expires_at=8; }
message StockBalance { string item_id=1; string warehouse_id=2; smartfarm.common.v1.Quantity on_hand=3; smartfarm.common.v1.Quantity reserved=4; smartfarm.common.v1.Quantity available=5; }
message CreateItemRequest { smartfarm.common.v1.RequestContext context=1; InventoryItem item=2; }
message UpdateItemRequest { smartfarm.common.v1.RequestContext context=1; string item_id=2; string name=3; string unit=4; ItemCategory category=5; smartfarm.common.v1.Quantity reorder_threshold=6; }
message SetItemStatusRequest { smartfarm.common.v1.RequestContext context=1; string item_id=2; ItemStatus status=3; }
message UpdateWarehouseRequest { smartfarm.common.v1.RequestContext context=1; string warehouse_id=2; string name=3; string description=4; string address=5; }
message SetWarehouseStatusRequest { smartfarm.common.v1.RequestContext context=1; string warehouse_id=2; WarehouseStatus status=3; }
message ItemResponse { InventoryItem item=1; }
message GetItemRequest { smartfarm.common.v1.RequestContext context=1; string item_id=2; }
message ListItemsRequest { smartfarm.common.v1.RequestContext context=1; string query=2; ItemCategory category=3; smartfarm.common.v1.PageRequest page=4; }
message ListItemsResponse { repeated InventoryItem items=1; smartfarm.common.v1.PageResponse page=2; }
message CreateWarehouseRequest { smartfarm.common.v1.RequestContext context=1; Warehouse warehouse=2; }
message GetWarehouseRequest { smartfarm.common.v1.RequestContext context=1; string warehouse_id=2; }
message ListWarehousesRequest { smartfarm.common.v1.RequestContext context=1; string farm_id=2; WarehouseStatus status=3; string query=4; smartfarm.common.v1.PageRequest page=5; }
message WarehouseResponse { Warehouse warehouse=1; }
message ListWarehousesResponse { repeated Warehouse warehouses=1; smartfarm.common.v1.PageResponse page=2; }
message ListWarehouseItemsRequest { smartfarm.common.v1.RequestContext context=1; string warehouse_id=2; string query=3; ItemCategory category=4; bool low_stock_only=5; smartfarm.common.v1.PageRequest page=6; }
message ListWarehouseItemsResponse { Warehouse warehouse=1; repeated WarehouseStockItem items=2; smartfarm.common.v1.PageResponse page=3; }
message ReceiveStockRequest { smartfarm.common.v1.RequestContext context=1; StockLot lot=2; smartfarm.common.v1.Quantity quantity=3; string reference_id=4; }
message IssueStockRequest { smartfarm.common.v1.RequestContext context=1; string lot_id=2; smartfarm.common.v1.Quantity quantity=3; string reference_id=4; }
message AdjustStockRequest { smartfarm.common.v1.RequestContext context=1; string lot_id=2; smartfarm.common.v1.Quantity signed_delta=3; string reason=4; }
message StockMovementResponse { StockMovement movement=1; }
message ReserveStockRequest { smartfarm.common.v1.RequestContext context=1; string order_id=2; string item_id=3; string warehouse_id=4; smartfarm.common.v1.Quantity quantity=5; google.protobuf.Timestamp expires_at=6; }
message ReservationResponse { StockReservation reservation=1; }
message ReleaseReservationRequest { smartfarm.common.v1.RequestContext context=1; string reservation_id=2; string reason=3; }
message CommitReservationRequest { smartfarm.common.v1.RequestContext context=1; string reservation_id=2; }
message GetStockBalanceRequest { smartfarm.common.v1.RequestContext context=1; string item_id=2; string warehouse_id=3; }
message StockBalanceResponse { StockBalance balance=1; }
message ListLowStockRequest { smartfarm.common.v1.RequestContext context=1; string farm_id=2; smartfarm.common.v1.PageRequest page=3; }
message ListLowStockResponse { repeated StockBalance balances=1; smartfarm.common.v1.PageResponse page=2; }
message TraceLotRequest { smartfarm.common.v1.RequestContext context=1; string lot_id=2; smartfarm.common.v1.PageRequest page=3; }
message TraceLotResponse { StockLot lot=1; repeated StockMovement movements=2; smartfarm.common.v1.PageResponse page=3; }
