syntax = "proto3";
package smartfarm.events.v1;
option java_package = "com.htv.smartfarm.proto.events.v1";
option java_multiple_files = true;
option java_outer_classname = "EventsProto";
import "smartfarm/common/v1/common.proto";
import "smartfarm/livestock/v1/livestock.proto";
import "smartfarm/health/v1/health.proto";
import "smartfarm/inventory/v1/inventory.proto";
import "smartfarm/finance/v1/finance.proto";
import "smartfarm/order/v1/order.proto";
import "smartfarm/reporting/v1/reporting.proto";
import "google/protobuf/timestamp.proto";
// MQTT binary payload. Schema version is encoded by package/topic; event_id enables deduplication.
message EventMetadata { string event_id = 1; string tenant_id = 2; string farm_id = 3; string aggregate_id = 4; string correlation_id = 5; string causation_id = 6; string producer = 7; google.protobuf.Timestamp occurred_at = 8; string trace_id = 9; int64 aggregate_version = 10; }
message TaskChanged { smartfarm.livestock.v1.LivestockTask task = 1; }
// Raised by the deadline monitor when a task passes its accept or report deadline.
enum TaskDeadlineKind { TASK_DEADLINE_KIND_UNSPECIFIED = 0; TASK_DEADLINE_KIND_ACCEPT_OVERDUE = 1; TASK_DEADLINE_KIND_REPORT_OVERDUE = 2; }
message TaskDeadlineBreached { smartfarm.livestock.v1.LivestockTask task = 1; TaskDeadlineKind kind = 2; }
message AnimalChanged { smartfarm.livestock.v1.Animal animal = 1; }
message ObservationRecorded { smartfarm.health.v1.HealthObservation observation = 1; }
message VaccinationRecorded { smartfarm.health.v1.Vaccination vaccination = 1; }
message HealthAlertRaised { smartfarm.health.v1.HealthAlert alert = 1; }
message StockMovementRecorded { smartfarm.inventory.v1.StockMovement movement = 1; }
message StockReservationChanged { smartfarm.inventory.v1.StockReservation reservation = 1; string reason = 2; }
message LowStockDetected { smartfarm.inventory.v1.StockBalance balance = 1; }
message FinanceTransactionRecorded { smartfarm.finance.v1.FinanceTransaction transaction = 1; }
message DebtChanged { smartfarm.finance.v1.Debt debt = 1; }
message OrderChanged { smartfarm.order.v1.FarmOrder order = 1; }
// Operational/audit event. It does not participate in the ordered Order projection.
message OrderLifecycleEvent {
  string event_type = 1;
  string saga_id = 2;
  string step_key = 3;
  string actor_id = 4;
  string previous_status = 5;
  string new_status = 6;
  string reason_code = 7;
  string reason = 8;
  smartfarm.order.v1.FarmOrder order = 9;
}
message ExportJobChanged { smartfarm.reporting.v1.ExportJob job = 1; }
// Operational/audit event emitted by identity (account/role/membership/mfa lifecycle). Mirrors the
// generic shape of OrderLifecycleEvent: a typed envelope carrying a free-form string map so identity
// does not need a dedicated proto message per account/role/membership change. Does not participate in
// any ordered projection; consumed by the gateway WS bridge for live admin UX.
message IdentityLifecycleEvent {
  string event_type = 1;      // e.g. identity.role.created, identity.membership.suspended
  string aggregate_type = 2;  // e.g. account, role, membership
  string actor_id = 3;        // who performed the action (may be empty for system)
  map<string, string> data = 4; // flattened event detail (scalar values stringified)
}
message DomainEvent { EventMetadata metadata = 1; oneof payload { TaskChanged task_changed = 10; AnimalChanged animal_changed = 11; ObservationRecorded observation_recorded = 12; VaccinationRecorded vaccination_recorded = 13; HealthAlertRaised health_alert_raised = 14; StockMovementRecorded stock_movement_recorded = 15; StockReservationChanged stock_reservation_changed = 16; LowStockDetected low_stock_detected = 17; FinanceTransactionRecorded finance_transaction_recorded = 18; DebtChanged debt_changed = 19; OrderChanged order_changed = 20; ExportJobChanged export_job_changed = 21; TaskDeadlineBreached task_deadline_breached = 22; OrderLifecycleEvent order_lifecycle_event = 23; IdentityLifecycleEvent identity_lifecycle_event = 24; } }
