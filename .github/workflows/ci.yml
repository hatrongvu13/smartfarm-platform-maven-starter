# CI: build + test toàn bộ module Maven, rồi build image của từng service (không push).
# Action ghim theo SHA commit (tag có thể bị dời); tag tương ứng ghi ở cuối dòng.
name: ci

# Chạy trên mọi nhánh được push (kiểm sớm, không cần mở PR) và trên PR từ fork.
# PR từ chính repo này đã có lần chạy do push; concurrency bên dưới hủy lần chạy cũ cùng ref.
on:
  push:
    branches: [ '**' ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: mvn verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Test không cần Redis/PostgreSQL thật (H2 + kho session trong bộ nhớ).
      # Test mTLS tự sinh cert bằng scripts/generate-dev-mtls.sh (bash + openssl có sẵn trên runner).
      - name: Build và test
        run: mvn -B -ntp verify

      - name: Lưu báo cáo test khi lỗi
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  image:
    name: docker build (${{ matrix.service }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [ platform/api-gateway, services/identity-service, services/farm-service ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        env:
          SERVICE_PATH: ${{ matrix.service }}
        run: docker build --build-arg SERVICE_PATH="$SERVICE_PATH" --build-arg OCI_REVISION="$GITHUB_SHA" -t "farmverse-ci:${GITHUB_SHA}" .
