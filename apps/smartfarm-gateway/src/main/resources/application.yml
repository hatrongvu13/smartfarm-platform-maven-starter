spring:
  lifecycle:
    timeout-per-shutdown-phase: ${SMARTFARM_SHUTDOWN_TIMEOUT:30s}
  application:
    name: smartfarm-gateway
  main:
    web-application-type: reactive
  profiles:
    default:
      - dev
  graphql:
    graphiql:
      enabled: false
      path: /graphiql
    http:
      path: /graphql

server:
  shutdown: graceful
  port: 8080

smartfarm:
  security:
    jwt:
      issuer: ${IDENTITY_ISSUER:http://localhost:8092}
      jwk-set-uri: ${IDENTITY_JWK_SET_URI:http://localhost:8092/.well-known/jwks.json}
      audiences:
        - ${SMARTFARM_JWT_AUDIENCE:smartfarm-gateway}
      allow-local-http: false
    grpc:
      enabled: false
      audit-enabled: false
      correlation-enabled: true
      default-deadline: ${GATEWAY_GRPC_DEFAULT_DEADLINE:5s}
      identity-deadline: ${GATEWAY_IDENTITY_GRPC_DEADLINE:5s}
      service-token-timeout: ${GATEWAY_SERVICE_TOKEN_TIMEOUT:5s}
      channel-shutdown-timeout: ${GATEWAY_GRPC_CHANNEL_SHUTDOWN_TIMEOUT:10s}
    correlation:
      header-name: x-correlation-id
      max-length: 128
      response-header-enabled: true

  identity:
    base-url: ${IDENTITY_HTTP_BASE_URL:http://localhost:8092}
    grpc-host: ${IDENTITY_GRPC_HOST:localhost}
    grpc-port: ${IDENTITY_GRPC_PORT:9092}
    grpc-audience: smartfarm-identity

  gateway:
    service-client:
      id: ${GATEWAY_SERVICE_CLIENT_ID:gateway}
      secret: ${GATEWAY_SERVICE_CLIENT_SECRET:}
    grpc:
      order-deadline: ${GATEWAY_ORDER_GRPC_DEADLINE:5s}
      saga-admin-deadline: ${GATEWAY_ORDER_SAGA_GRPC_DEADLINE:5s}
      inventory-deadline: ${GATEWAY_INVENTORY_GRPC_DEADLINE:5s}

  mqtt:
    url: ${SMARTFARM_MQTT_URL:tcp://localhost:1883}

  events:
    mqtt:
      enabled: ${SMARTFARM_MQTT_EVENTS_ENABLED:false}
      topic-filter: ${SMARTFARM_MQTT_TOPIC_FILTER:smartfarm/+/+/domain/#}

  livestock:
    grpc-host: ${LIVESTOCK_GRPC_HOST:localhost}
    grpc-port: ${LIVESTOCK_GRPC_PORT:9091}
  inventory:
    grpc-host: ${INVENTORY_GRPC_HOST:localhost}
    grpc-port: ${INVENTORY_GRPC_PORT:9093}
  order:
    grpc-host: ${ORDER_GRPC_HOST:localhost}
    grpc-port: ${ORDER_GRPC_PORT:9095}
  reporting:
    grpc-host: ${REPORTING_GRPC_HOST:localhost}
    grpc-port: ${REPORTING_GRPC_PORT:9096}
  finance:
    grpc-host: ${FINANCE_GRPC_HOST:localhost}
    grpc-port: ${FINANCE_GRPC_PORT:9097}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,ping
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
