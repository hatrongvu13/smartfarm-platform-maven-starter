spring:
  graphql:
    graphiql:
      enabled: true

smartfarm:
  security:
    jwt:
      issuer: ${IDENTITY_ISSUER:http://localhost:8092}
      jwk-set-uri: ${IDENTITY_JWK_SET_URI:http://localhost:8092/.well-known/jwks.json}
      audiences:
        - smartfarm-gateway
      allow-local-http: true
    # DEV: app-level MQTT message auth (HMAC-SHA256). sign+verify ON live; shared DEV-ONLY secret.
    mqtt:
      sign-enabled: ${MQTT_SIGN_ENABLED:true}
      verify-enabled: ${MQTT_VERIFY_ENABLED:true}
      hmac-secret: ${MQTT_HMAC_SECRET:dev-mqtt-hmac-secret-shared-across-all-services}
      key-id: ${MQTT_HMAC_KEY_ID:dev-key-1}
      max-clock-skew-millis: ${MQTT_MAX_CLOCK_SKEW_MILLIS:0}

  identity:
    base-url: ${IDENTITY_HTTP_BASE_URL:http://127.0.0.1:8092}
    grpc-host: ${IDENTITY_GRPC_HOST:127.0.0.1}
    grpc-port: ${IDENTITY_GRPC_PORT:9092}
    grpc-audience: smartfarm-identity

  gateway:
    service-client:
      id: gateway
      # DEV default matches the BCrypt hash identity whitelists for the `gateway` client
      # (IDENTITY_GATEWAY_CLIENT_SECRET_HASH). Without it the gateway cannot mint identity
      # service-tokens -> getPrincipal/getSecurityProfile fail with UNAUTHENTICATED
      # ("gateway service-client secret is not configured"). Dev-only; prod requires the env var.
      secret: ${GATEWAY_SERVICE_CLIENT_SECRET:dev-gateway-service-secret}

  mqtt:
    url: ${SMARTFARM_MQTT_URL:tcp://localhost:1883}

  events:
    mqtt:
      enabled: true
      topic-filter: ${SMARTFARM_MQTT_TOPIC_FILTER:smartfarm/+/+/domain/#}
