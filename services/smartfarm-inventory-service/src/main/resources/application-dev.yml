server:
  address: 127.0.0.1
spring:
  datasource:
    url: jdbc:h2:file:./.local/inventory-db;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  grpc:
    server:
      address: 127.0.0.1
      port: 9093
smartfarm:
  security:
    issuer: http://localhost:8092
    jwk-set-uri: http://localhost:8092/.well-known/jwks.json
    # Verify our OWN audience: a user's access token (aud=smartfarm-gateway) can no longer
    # call this service directly — only the gateway's per-service token (aud=smartfarm-inventory).
    audience: smartfarm-inventory
    allow-local-http: true
  inventory:
    mqtt:
      enabled: true
      url: tcp://localhost:1883
      client-id: smartfarm-inventory-dev
      persistence-path: ./.local/mqtt-inventory
