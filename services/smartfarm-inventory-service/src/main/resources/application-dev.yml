server:
  address: 127.0.0.1
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/smartfarm
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # DEV strategy: Hibernate owns the schema for fast iteration (disposable dev DB).
      # Flyway is OFF in dev; reserved for TEST + PROD. See docs/refactor/DEV-DB-WORKFLOW.md.
      ddl-auto: update
  flyway:
    enabled: false
  grpc:
    server:
      address: 127.0.0.1
      port: 9093
smartfarm:
  security:
    issuer: http://localhost:8092
    jwk-set-uri: http://localhost:8092/.well-known/jwks.json
    # Verify our OWN audience: a user's access token (aud=smartfarm-gateway) can no longer
    # call this service directly — only the gateway's per-service token (aud=smartfarm-inventory).
    audience: smartfarm-inventory
    allow-local-http: true
  inventory:
    mqtt:
      enabled: true
      url: tcp://localhost:1883
      client-id: smartfarm-inventory-dev
      persistence-path: ./.local/mqtt-inventory
