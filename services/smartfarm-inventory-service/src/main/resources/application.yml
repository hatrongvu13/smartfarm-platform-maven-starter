spring:
  application:
    name: smartfarm-inventory-service
  profiles:
    # Mặc định cứng = dev khi khởi chạy bình thường (mvn spring-boot:run / java -jar) mà không
    # cần set biến môi trường. Override bằng SPRING_PROFILES_ACTIVE=prod|test khi cần.
    active: ${SPRING_PROFILES_ACTIVE:dev}
server:
  port: 8083
  # SINGLE-INGRESS: internal service. Bind loopback only; the gateway is the sole public
  # ingress. Override INVENTORY_BIND_ADDRESS only for a private cross-host mesh.
  address: ${INVENTORY_BIND_ADDRESS:127.0.0.1}
management:
  endpoints:
    web:
      exposure:
        include: health,info
smartfarm:
  security:

    authorization-invalidation:
      mqtt:
        enabled: ${AUTHORIZATION_INVALIDATION_MQTT_ENABLED:true}
        broker-url: ${SMARTFARM_MQTT_URL:tcp://localhost:1883}
        topic-filter: ${AUTHORIZATION_INVALIDATION_TOPIC_FILTER:smartfarm/+/_global/domain/authorization-invalidated/v1}
        client-id: ${AUTHORIZATION_INVALIDATION_CLIENT_ID:${spring.application.name}-authorization-watermark-${HOSTNAME:local}}
        qos: ${AUTHORIZATION_INVALIDATION_QOS:1}
        username: ${SMARTFARM_MQTT_USERNAME:}
        password: ${SMARTFARM_MQTT_PASSWORD:}
    jwt:
      issuer: ${SMARTFARM_JWT_ISSUER}
      jwk-set-uri: ${SMARTFARM_JWKS_URI}
      audiences:
        - ${SMARTFARM_JWT_AUDIENCE:smartfarm-inventory}
      allow-local-http: false
    grpc:
      require-explicit-policy: true
      authorities:
        "[smartfarm.inventory.v1.InventoryService/CreateItem]": inventory:write
        "[smartfarm.inventory.v1.InventoryService/UpdateItem]": inventory:write
        "[smartfarm.inventory.v1.InventoryService/SetItemStatus]": inventory:write
        "[smartfarm.inventory.v1.InventoryService/UpdateWarehouse]": inventory:write
        "[smartfarm.inventory.v1.InventoryService/SetWarehouseStatus]": inventory:write
        "[smartfarm.inventory.v1.InventoryService/GetItem]": inventory:read
        "[smartfarm.inventory.v1.InventoryService/ListItems]": inventory:read
        "[smartfarm.inventory.v1.InventoryService/CreateWarehouse]": inventory:write
        "[smartfarm.inventory.v1.InventoryService/GetWarehouse]": inventory:read
        "[smartfarm.inventory.v1.InventoryService/ListWarehouses]": inventory:read
        "[smartfarm.inventory.v1.InventoryService/ListWarehouseItems]": inventory:read
        "[smartfarm.inventory.v1.InventoryService/ReceiveStock]": inventory:write
        "[smartfarm.inventory.v1.InventoryService/IssueStock]": inventory:write
        "[smartfarm.inventory.v1.InventoryService/AdjustStock]": inventory:write
        "[smartfarm.inventory.v1.InventoryService/ReserveStock]": inventory:write
        "[smartfarm.inventory.v1.InventoryService/ReleaseReservation]": inventory:write
        "[smartfarm.inventory.v1.InventoryService/CommitReservation]": inventory:write
        "[smartfarm.inventory.v1.InventoryService/GetStockBalance]": inventory:read
        "[smartfarm.inventory.v1.InventoryService/ListLowStock]": inventory:read
        "[smartfarm.inventory.v1.InventoryService/TraceLot]": inventory:read
  inventory:
    mqtt:
      enabled: false
