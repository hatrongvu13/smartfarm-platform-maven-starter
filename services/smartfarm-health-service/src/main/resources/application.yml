spring:
  application:
    name: smartfarm-health-service
  profiles:
    default: dev
  grpc:
    server:
      port: 9097
server:
  port: 8087
management:
  endpoints:
    web:
      exposure:
        include: health,info
smartfarm:
  security:
    jwt:
      issuer: ${SMARTFARM_JWT_ISSUER:}
      jwk-set-uri: ${SMARTFARM_JWKS_URI:}
      audiences:
        - ${SMARTFARM_JWT_AUDIENCE:smartfarm-health}
      allow-local-http: false
