server:
  address: 127.0.0.1
spring:
  grpc:
    server:
      address: 127.0.0.1
  datasource:
    url: jdbc:postgresql://localhost:5432/smartfarm
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
smartfarm:
  security:
    issuer: http://localhost:8092
    jwk-set-uri: http://localhost:8092/.well-known/jwks.json
    # Verify our OWN audience: a user's access token (aud=smartfarm-gateway) can no longer
    # call this service directly — only the gateway's per-service token (aud=smartfarm-health).
    audience: smartfarm-health
    allow-local-http: true
