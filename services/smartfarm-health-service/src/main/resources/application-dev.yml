server:
  address: 127.0.0.1
spring:
  grpc:
    server:
      address: 127.0.0.1
  datasource:
    url: jdbc:postgresql://localhost:5432/smartfarm
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # DEV strategy: Hibernate owns the schema for fast iteration (disposable dev DB).
      # Flyway is OFF in dev; reserved for TEST + PROD. See docs/refactor/DEV-DB-WORKFLOW.md.
      ddl-auto: update
  flyway:
    enabled: false
smartfarm:
  security:
    jwt:
      issuer: http://localhost:8092
      jwk-set-uri: http://localhost:8092/.well-known/jwks.json
      audiences:
        - smartfarm-health
      allow-local-http: true
    # DEV: app-level MQTT message auth (HMAC-SHA256). sign+verify ON live; shared DEV-ONLY secret.
    mqtt:
      sign-enabled: ${MQTT_SIGN_ENABLED:true}
      verify-enabled: ${MQTT_VERIFY_ENABLED:true}
      hmac-secret: ${MQTT_HMAC_SECRET:dev-mqtt-hmac-secret-shared-across-all-services}
      key-id: ${MQTT_HMAC_KEY_ID:dev-key-1}
      max-clock-skew-millis: ${MQTT_MAX_CLOCK_SKEW_MILLIS:0}
