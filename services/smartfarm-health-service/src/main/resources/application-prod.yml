spring:
  datasource:
    url: ${HEALTH_DB_URL}
    username: ${HEALTH_DB_USER}
    password: ${HEALTH_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
smartfarm:
  security:
    jwt:
      issuer: ${SMARTFARM_JWT_ISSUER}
      jwk-set-uri: ${SMARTFARM_JWKS_URI}
      audiences:
        - smartfarm-health
      allow-local-http: false
server:
  address: ${HEALTH_BIND_ADDRESS:127.0.0.1}
spring.grpc.server.address: ${HEALTH_GRPC_BIND_ADDRESS:127.0.0.1}
