spring:
  datasource:
    url: ${LIVESTOCK_DB_URL}
    username: ${LIVESTOCK_DB_USER}
    password: ${LIVESTOCK_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
smartfarm:
  security:
    jwt:
      issuer: ${SMARTFARM_JWT_ISSUER}
      jwk-set-uri: ${SMARTFARM_JWKS_URI}
      audiences:
        - smartfarm-livestock
      allow-local-http: false
  outbox:
    enabled: false
server:
  # SINGLE-HOST prod: HTTP bound to loopback (gateway is the sole ingress).
  address: ${LIVESTOCK_BIND_ADDRESS:127.0.0.1}
spring.grpc.server.address: ${LIVESTOCK_GRPC_BIND_ADDRESS:127.0.0.1}