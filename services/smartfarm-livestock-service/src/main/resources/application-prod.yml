spring:
  datasource:
    url: ${LIVESTOCK_DB_URL}
    username: ${LIVESTOCK_DB_USER}
    password: ${LIVESTOCK_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
smartfarm:
  security:
    jwt:
      issuer: ${SMARTFARM_JWT_ISSUER}
      jwk-set-uri: ${SMARTFARM_JWKS_URI}
      audiences:
        - smartfarm-livestock
      allow-local-http: false
    # PROD: app-level MQTT message auth (HMAC-SHA256). Default OFF; rollout in docs/security/mqtt-acl-mtls.md.
    mqtt:
      sign-enabled: ${MQTT_SIGN_ENABLED:false}
      verify-enabled: ${MQTT_VERIFY_ENABLED:false}
      hmac-secret: ${MQTT_HMAC_SECRET:}
      key-id: ${MQTT_HMAC_KEY_ID:default}
      max-clock-skew-millis: ${MQTT_MAX_CLOCK_SKEW_MILLIS:0}
  outbox:
    enabled: false
server:
  # SINGLE-HOST prod: HTTP bound to loopback (gateway is the sole ingress).
  address: ${LIVESTOCK_BIND_ADDRESS:127.0.0.1}
spring.grpc.server.address: ${LIVESTOCK_GRPC_BIND_ADDRESS:127.0.0.1}