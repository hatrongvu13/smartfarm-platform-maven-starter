spring:
  # @Scheduled beans (OutboxRelay, ScheduleTaskGenerator, TaskDeadlineMonitor) share ONE
  # scheduler thread by default. OutboxRelay.poll() publishes to MQTT synchronously; with no
  # broker up, each publish blocks on the connect timeout and starves the generator/monitor.
  # A small pool keeps them independent so the schedule generator still fires without a broker.
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: jdbc:postgresql://localhost:5432/smartfarm
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema now; Hibernate only validates entities against it.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
smartfarm:
  security:
    issuer: http://localhost:8092
    jwk-set-uri: http://localhost:8092/.well-known/jwks.json
    # Verify our OWN audience: a user's access token (aud=smartfarm-gateway) can no longer
    # call this service directly — only the gateway's per-service token (aud=smartfarm-livestock).
    audience: smartfarm-livestock
    allow-local-http: true
  mqtt:
    url: tcp://localhost:1883
  outbox:
    enabled: true
    poll-ms: 2000
  livestock:
    monitor:
      enabled: true
      poll-ms: 15000            # quét quá hạn mỗi 15s (dev)
    schedule-generator:
      enabled: true
      poll-ms: 15000            # sinh task theo cron mỗi 15s (dev)
    deadlines:
      accept-window-seconds: 120   # dev: 2 phút để nhận (prod nên 5-10')
      report-window-seconds: 600   # dev: 10 phút để báo cáo
      report-window-seconds-by-type:
        TASK_TYPE_MEDICATION: 1800  # tiêm/thuốc: 30 phút
        TASK_TYPE_INSPECTION: 900   # kiểm tra: 15 phút
