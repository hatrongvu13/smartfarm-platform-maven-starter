# PROD — mọi bí mật lấy từ biến môi trường, không có giá trị mặc định.
spring:
  datasource:
    url: ${IDENTITY_DB_URL}
    username: ${IDENTITY_DB_USER}
    password: ${IDENTITY_DB_PASSWORD}
  flyway:
    user: ${IDENTITY_DB_MIGRATION_USER}
    password: ${IDENTITY_DB_MIGRATION_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: true

# Log JSON (ECS): nhật ký bảo mật SECURITY_AUDIT có field riêng cho từng cặp key/value.
logging:
  structured:
    format:
      console: ecs

farmverse:
  identity:
    issuer: ${IDENTITY_ISSUER}
    signing-key:
      key-id: ${IDENTITY_KEY_ID}
      private-key: ${IDENTITY_PRIVATE_KEY_PATH}
      public-key: ${IDENTITY_PUBLIC_KEY_PATH}
    clients:
      - client-id: farmverse-gateway
        client-secret: ${GATEWAY_CLIENT_SECRET}
        name: FarmVerse API Gateway (BFF)
        grant-types: [authorization_code, refresh_token]
        redirect-uris: [ "${GATEWAY_PUBLIC_URL}/login/oauth2/code/farmverse" ]
        post-logout-redirect-uris: [ "${GATEWAY_PUBLIC_URL}/" ]
        scopes: [openid, profile, email, farmverse.api]
      - client-id: farmverse-service
        client-secret: ${SERVICE_CLIENT_SECRET}
        name: FarmVerse internal services
        grant-types: [client_credentials]
        scopes: [farmverse.api]
    bootstrap:
      admin-email: ${IDENTITY_ADMIN_EMAIL:}
      admin-password: ${IDENTITY_ADMIN_PASSWORD:}
