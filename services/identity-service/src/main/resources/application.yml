spring:
  application:
    name: identity-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    # mTLS: prod luôn bật. Dev mặc định TẮT; bật bằng SPRING_PROFILES_ACTIVE=dev,mtls
    # (cần chạy scripts/generate-dev-mtls.sh trước). Xem application-mtls.yml.
    group:
      prod: [ mtls ]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema do Flyway quản (db/migration)
  flyway:
    enabled: true

server:
  port: 8092
  address: ${IDENTITY_BIND_ADDRESS:127.0.0.1}
  servlet:
    session:
      cookie:
        # Cookie không phân biệt cổng: đặt tên riêng để không đè cookie FV_SESSION của gateway (cùng host).
        name: FV_IDP_SESSION

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Tài liệu OpenAPI + Swagger UI: mặc định TẮT (prod). application-dev.yml bật.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

farmverse:
  identity:
    issuer: ${IDENTITY_ISSUER:http://localhost:8092}
    signing-key:
      key-id: ${IDENTITY_KEY_ID:dev-key-1}
      private-key: ${IDENTITY_PRIVATE_KEY_PATH:classpath:.local/identity-private.pem}
      public-key: ${IDENTITY_PUBLIC_KEY_PATH:classpath:.local/identity-public.pem}
      # Khóa đã nghỉ (xoay khóa): chỉ công bố khóa công khai ở JWKS, không ký nữa.
      # Khai bằng biến môi trường FARMVERSE_IDENTITY_SIGNINGKEY_RETIRED_0_KEYID / _PUBLICKEY.
      # Xem docs/operations/key-rotation.md.
      retired: []
    mfa:
      issuer: FarmVerse
      encryption-password: ${IDENTITY_MFA_ENCRYPTION_PASSWORD}
      encryption-salt: ${IDENTITY_MFA_ENCRYPTION_SALT}
    lockout:
      max-failures: 5
      duration: 15m
    # Danh mục permission của nền tảng (seed lúc khởi động, system_owned).
    # Mỗi service thêm mã của mình ở cấp của nó.
    catalog:
      permissions:
        - { code: "identity:user:read",        resource-type: "identity-user",       action: "read",   description: "Xem người dùng trong tenant" }
        - { code: "identity:user:manage",      resource-type: "identity-user",       action: "manage", description: "Thêm người dùng, đổi trạng thái, gán role" }
        - { code: "identity:role:read",        resource-type: "identity-role",       action: "read",   description: "Xem role và permission" }
        - { code: "identity:role:manage",      resource-type: "identity-role",       action: "manage", description: "Tạo / sửa / xóa role của tenant" }
        - { code: "identity:permission:manage", resource-type: "identity-permission", action: "manage", description: "Sửa danh mục permission (nền tảng)" }
        - { code: "identity:tenant:manage",    resource-type: "identity-tenant",     action: "manage", description: "Tạo tenant (nền tảng)" }
        - { code: "farm:farm:read",            resource-type: "farm-farm",           action: "read",   description: "Xem trang trại và chuồng" }
        - { code: "farm:farm:write",           resource-type: "farm-farm",           action: "write",  description: "Tạo / sửa trang trại và chuồng" }
