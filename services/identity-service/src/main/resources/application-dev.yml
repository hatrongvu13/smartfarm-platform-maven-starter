# DEV — chỉ giá trị dùng trên máy cá nhân. Không dùng ở prod.
spring:
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/farmverse_identity}
    username: ${IDENTITY_DB_USER:identity_app}          # chỉ DML (infra/postgres-init.sh)
    password: ${IDENTITY_DB_PASSWORD:identity-app-dev}
  # Flyway chạy bằng vai trò sở hữu schema; ứng dụng không có quyền đổi cấu trúc bảng.
  flyway:
    user: ${IDENTITY_DB_MIGRATION_USER:identity_owner}
    password: ${IDENTITY_DB_MIGRATION_PASSWORD:identity-owner-dev}

springdoc:
  api-docs:
    enabled: true     # http://localhost:8092/v3/api-docs
  swagger-ui:
    enabled: true     # http://localhost:8092/swagger-ui.html

farmverse:
  identity:
    clients:
      - client-id: farmverse-gateway
        client-secret: ${GATEWAY_CLIENT_SECRET:dev-gateway-secret-change-me-0123456789}
        name: FarmVerse API Gateway (BFF)
        grant-types: [authorization_code, refresh_token]
        redirect-uris: [ "http://127.0.0.1:8080/login/oauth2/code/farmverse" ]
        post-logout-redirect-uris: [ "http://127.0.0.1:8080/" ]
        scopes: [openid, profile, email, farmverse.api]
      - client-id: farmverse-service
        client-secret: ${SERVICE_CLIENT_SECRET:dev-service-secret-change-me-0123456789}
        name: FarmVerse internal services (client_credentials, cấp 2)
        grant-types: [client_credentials]
        scopes: [farmverse.api]
    bootstrap:
      admin-email: ${IDENTITY_ADMIN_EMAIL:admin@farmverse.local}
      admin-password: ${IDENTITY_ADMIN_PASSWORD:Admin@123456789}
      admin-display-name: Super Admin (dev)
    mfa:
      encryption-password: ${IDENTITY_MFA_ENCRYPTION_PASSWORD:dev-mfa-password-change-me}
      encryption-salt: ${IDENTITY_MFA_ENCRYPTION_SALT:5c0744940b5c369b}
