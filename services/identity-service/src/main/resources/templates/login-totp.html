<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/auth :: head('Xác thực hai bước')}"></head>
<body>
<main class="card">
    <div th:replace="~{fragments/auth :: brand}"></div>

    <h1>Xác thực hai bước</h1>
    <p class="lead">Nhập mã 6 số trong ứng dụng authenticator.</p>

    <p id="totp-message" class="alert alert-error" role="alert" th:if="${param.error != null}">
        Mã không đúng hoặc đã dùng. Hãy thử mã mới.
    </p>
    <p id="totp-message" class="alert alert-error" role="alert" th:if="${limited != null}"
       th:text="${limited}">Thử quá nhiều lần. Hãy đợi rồi thử lại.</p>

    <form method="post" th:action="@{/login/totp}">
        <div class="field">
            <label for="code">Mã xác thực hoặc mã khôi phục</label>
            <input id="code" name="code" class="code" maxlength="12" autocomplete="one-time-code"
                   autocapitalize="characters" spellcheck="false" inputmode="text" required autofocus
                   th:aria-describedby="${hasMessage} ? 'totp-message code-hint' : 'code-hint'">
            <p id="code-hint" class="hint">
                Mất điện thoại? Nhập một mã khôi phục. Mỗi mã chỉ dùng được một lần.
            </p>
        </div>
        <button class="button" type="submit">Xác nhận</button>
    </form>

    <p class="links"><a th:href="@{/login}">Quay lại đăng nhập</a></p>
</main>
</body>
</html>
