spring:
  application:
    name: smartfarm-order-service
  profiles:
    default: dev
server:
  port: 8085
management:
  endpoint:
    health:
      show-details: ${ORDER_HEALTH_SHOW_DETAILS:when-authorized}
  endpoints:
    web:
      exposure:
        include: health,info
spring.grpc.server.port: 9095
smartfarm:
  security:
    issuer: ${SMARTFARM_JWT_ISSUER:}
    jwk-set-uri: ${SMARTFARM_JWKS_URI:}
    audience: ${SMARTFARM_JWT_AUDIENCE:smartfarm-order}
    allow-local-http: false
  identity:
    base-url: ${IDENTITY_BASE_URL:http://localhost:8092}
  order:
    readmodel:
      enabled: ${ORDER_READMODEL_ENABLED:true}
      client-id: ${ORDER_READMODEL_CLIENT_ID:smartfarm-order-readmodel-client}
      topic-filter: ${ORDER_READMODEL_TOPIC_FILTER:smartfarm/+/+/domain/order-changed/+}
      gap-recovery:
        enabled: ${ORDER_PROJECTION_GAP_RECOVERY_ENABLED:false}
        batch-size: ${ORDER_PROJECTION_GAP_RECOVERY_BATCH_SIZE:20}
        maximum-attempts: ${ORDER_PROJECTION_GAP_RECOVERY_MAXIMUM_ATTEMPTS:12}
        initial-retry: ${ORDER_PROJECTION_GAP_RECOVERY_INITIAL_RETRY:10s}
        maximum-retry: ${ORDER_PROJECTION_GAP_RECOVERY_MAXIMUM_RETRY:10m}
        claim-timeout: ${ORDER_PROJECTION_GAP_RECOVERY_CLAIM_TIMEOUT:2m}
        manual-review-after: ${ORDER_PROJECTION_GAP_RECOVERY_MANUAL_REVIEW_AFTER:24h}
        instance-id: ${ORDER_PROJECTION_GAP_RECOVERY_INSTANCE_ID:order-gap-recovery}
        poll-interval: ${ORDER_PROJECTION_GAP_RECOVERY_POLL_INTERVAL:5s}
    saga:
      enabled: ${ORDER_SAGA_ENABLED:true}
      batch-size: ${ORDER_SAGA_BATCH_SIZE:20}
      maximum-attempts: ${ORDER_SAGA_MAXIMUM_ATTEMPTS:8}
      initial-retry: ${ORDER_SAGA_INITIAL_RETRY:5s}
      maximum-retry: ${ORDER_SAGA_MAXIMUM_RETRY:5m}
      claim-timeout: ${ORDER_SAGA_CLAIM_TIMEOUT:2m}
      compensation-deadline: ${ORDER_SAGA_COMPENSATION_DEADLINE:6h}
      poll-interval: ${ORDER_SAGA_POLL_INTERVAL:1s}
    service-client:
      id: order
      secret: ${ORDER_SERVICE_SECRET:}
  inventory:
    grpc-host: ${INVENTORY_GRPC_HOST:localhost}
    grpc-port: ${INVENTORY_GRPC_PORT:9093}
  finance:
    grpc-host: ${FINANCE_GRPC_HOST:localhost}
    grpc-port: ${FINANCE_GRPC_PORT:9094}
