spring:
  application:
    name: smartfarm-order-service
  profiles:
    default: dev
server:
  port: 8085
management:
  endpoint:
    health:
      show-details: ${ORDER_HEALTH_SHOW_DETAILS:when-authorized}
      probes:
        enabled: true
      status:
        order: down,out-of-service,unknown,degraded,up
        http-mapping:
          degraded: 200
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,ping
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
spring.grpc.server.port: 9095
smartfarm:
  security:
    issuer: ${SMARTFARM_JWT_ISSUER:}
    jwk-set-uri: ${SMARTFARM_JWKS_URI:}
    audience: ${SMARTFARM_JWT_AUDIENCE:smartfarm-order}
    allow-local-http: false
  identity:
    base-url: ${IDENTITY_BASE_URL:http://localhost:8092}
  order:
    observability:
      saga-oldest-active-warning: ${ORDER_OBSERVABILITY_SAGA_OLDEST_ACTIVE_WARNING:15m}
      outbox-pending-warning: ${ORDER_OBSERVABILITY_OUTBOX_PENDING_WARNING:1000}
      outbox-oldest-pending-warning: ${ORDER_OBSERVABILITY_OUTBOX_OLDEST_PENDING_WARNING:5m}
      projection-gap-warning: ${ORDER_OBSERVABILITY_PROJECTION_GAP_WARNING:100}
      projection-oldest-gap-warning: ${ORDER_OBSERVABILITY_PROJECTION_OLDEST_GAP_WARNING:15m}
    readmodel:
      enabled: ${ORDER_READMODEL_ENABLED:true}
      client-id: ${ORDER_READMODEL_CLIENT_ID:smartfarm-order-readmodel-client}
      topic-filter: ${ORDER_READMODEL_TOPIC_FILTER:smartfarm/+/+/domain/order-changed/+}
      gap-recovery:
        enabled: ${ORDER_PROJECTION_GAP_RECOVERY_ENABLED:true}
        batch-size: ${ORDER_PROJECTION_GAP_RECOVERY_BATCH_SIZE:20}
        maximum-attempts: ${ORDER_PROJECTION_GAP_RECOVERY_MAXIMUM_ATTEMPTS:12}
        initial-retry: ${ORDER_PROJECTION_GAP_RECOVERY_INITIAL_RETRY:10s}
        maximum-retry: ${ORDER_PROJECTION_GAP_RECOVERY_MAXIMUM_RETRY:10m}
        claim-timeout: ${ORDER_PROJECTION_GAP_RECOVERY_CLAIM_TIMEOUT:2m}
        manual-review-after: ${ORDER_PROJECTION_GAP_RECOVERY_MANUAL_REVIEW_AFTER:24h}
        instance-id: ${ORDER_PROJECTION_GAP_RECOVERY_INSTANCE_ID:order-gap-recovery}
        poll-interval: ${ORDER_PROJECTION_GAP_RECOVERY_POLL_INTERVAL:5s}
    saga:
      enabled: ${ORDER_SAGA_ENABLED:true}
      batch-size: ${ORDER_SAGA_BATCH_SIZE:20}
      maximum-attempts: ${ORDER_SAGA_MAXIMUM_ATTEMPTS:5}
      initial-retry: ${ORDER_SAGA_INITIAL_RETRY:5s}
      maximum-retry: ${ORDER_SAGA_MAXIMUM_RETRY:5m}
      claim-timeout: ${ORDER_SAGA_CLAIM_TIMEOUT:2m}
      processing-deadline: ${ORDER_SAGA_PROCESSING_DEADLINE:30m}
      finance-manual-review-window: ${ORDER_SAGA_FINANCE_MANUAL_REVIEW_WINDOW:60m}
      compensation-deadline: ${ORDER_SAGA_COMPENSATION_DEADLINE:6h}
      poll-interval: ${ORDER_SAGA_POLL_INTERVAL:1s}
    service-client:
      id: order
      secret: ${ORDER_SERVICE_SECRET:}
  inventory:
    grpc-host: ${INVENTORY_GRPC_HOST:localhost}
    grpc-port: ${INVENTORY_GRPC_PORT:9093}
  finance:
    grpc-host: ${FINANCE_GRPC_HOST:localhost}
    grpc-port: ${FINANCE_GRPC_PORT:9094}

  outbox:
    enabled: ${ORDER_OUTBOX_ENABLED:true}
    batch-size: ${ORDER_OUTBOX_BATCH_SIZE:50}
    maximum-attempts: ${ORDER_OUTBOX_MAXIMUM_ATTEMPTS:12}
    initial-retry: ${ORDER_OUTBOX_INITIAL_RETRY:5s}
    maximum-retry: ${ORDER_OUTBOX_MAXIMUM_RETRY:5m}
    publishing-timeout: ${ORDER_OUTBOX_PUBLISHING_TIMEOUT:2m}
    published-retention: ${ORDER_OUTBOX_PUBLISHED_RETENTION:7d}
    poll-ms: ${ORDER_OUTBOX_POLL_MS:2000}
    maintenance-ms: ${ORDER_OUTBOX_MAINTENANCE_MS:60000}
