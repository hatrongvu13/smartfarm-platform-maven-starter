#    username: sa
#    password:
  # Multi-thread scheduler so the MQTT outbox relay (synchronous publish; blocks on the
  # connect timeout when no broker is up) cannot starve other @Scheduled work.
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: jdbc:postgresql://localhost:5432/smartfarm
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
smartfarm:
  security:
    jwt:
      issuer: ${IDENTITY_ISSUER:http://localhost:8092}
      jwk-set-uri: ${IDENTITY_JWK_SET_URI:http://localhost:8092/.well-known/jwks.json}
      audiences:
        - smartfarm-gateway
        - smartfarm-identity
      allow-local-http: true
  order:
    service-client:
      id: order
      # Must match the bcrypt hash whitelisted for client 'order' in identity dev config. DEV ONLY.
      secret: dev-order-service-secret
  mqtt:
    url: tcp://localhost:1883
  outbox:
    enabled: true
    poll-ms: 2000
    batch-size: ${ORDER_OUTBOX_BATCH_SIZE:50}
    maximum-attempts: ${ORDER_OUTBOX_MAXIMUM_ATTEMPTS:12}
    initial-retry: ${ORDER_OUTBOX_INITIAL_RETRY:5s}
    maximum-retry: ${ORDER_OUTBOX_MAXIMUM_RETRY:5m}
    publishing-timeout: ${ORDER_OUTBOX_PUBLISHING_TIMEOUT:2m}
    published-retention: ${ORDER_OUTBOX_PUBLISHED_RETENTION:7d}
    maintenance-ms: ${ORDER_OUTBOX_MAINTENANCE_MS:60000}
