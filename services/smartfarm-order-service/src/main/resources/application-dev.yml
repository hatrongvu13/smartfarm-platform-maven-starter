spring:
#  datasource:
#    url: jdbc:h2:mem:order;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
#    username: sa
#    password:
  datasource:
    url: jdbc:postgresql://localhost:5432/myapp
    username: postgres
    password:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
smartfarm:
  security:
    issuer: http://localhost:8092
    jwk-set-uri: http://localhost:8092/.well-known/jwks.json
    audience: smartfarm-order
    allow-local-http: true
  order:
    service-client:
      id: order
      # Must match the bcrypt hash whitelisted for client 'order' in identity dev config. DEV ONLY.
      secret: dev-order-service-secret
