spring:
  datasource:
    url: ${ORDER_DB_URL}
    username: ${ORDER_DB_USER}
    password: ${ORDER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
smartfarm:
  security:
    issuer: ${SMARTFARM_JWT_ISSUER}
    jwk-set-uri: ${SMARTFARM_JWKS_URI}
    audience: smartfarm-order
    allow-local-http: false
