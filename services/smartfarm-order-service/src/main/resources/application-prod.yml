spring:
  datasource:
    url: ${ORDER_DB_URL}
    username: ${ORDER_DB_USER}
    password: ${ORDER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
  grpc:
    server:
      port: ${ORDER_GRPC_PORT:9095}
      # SINGLE-HOST prod: bind gRPC to loopback. Override ORDER_GRPC_BIND_ADDRESS=0.0.0.0
      # (and set the callers' *_GRPC_HOST) only when services run on separate hosts.
      address: ${ORDER_GRPC_BIND_ADDRESS:127.0.0.1}
server:
  # SINGLE-HOST prod: HTTP (dev REST facades + actuator) bound to loopback; the gateway
  # is the sole public ingress. Override ORDER_BIND_ADDRESS only for a cross-host mesh.
  address: ${ORDER_BIND_ADDRESS:127.0.0.1}
smartfarm:
  security:
    # Dạng lồng `jwt` bắt buộc theo SmartFarmSecurityProperties.
    # Ở prod KHÔNG để default rỗng — các biến môi trường là bắt buộc.
    jwt:
      issuer: ${SMARTFARM_JWT_ISSUER}
      jwk-set-uri: ${SMARTFARM_JWKS_URI}
      audiences:
        - ${SMARTFARM_JWT_AUDIENCE:smartfarm-order}
      allow-local-http: false
  identity:
    base-url: ${IDENTITY_BASE_URL}
  order:
    service-client:
      id: ${ORDER_SERVICE_CLIENT_ID:order}
      secret: ${ORDER_SERVICE_SECRET}
    readmodel:
      client-id: ${ORDER_READMODEL_CLIENT_ID}
      gap-recovery:
        instance-id: ${ORDER_PROJECTION_GAP_RECOVERY_INSTANCE_ID}
  inventory:
    grpc-host: ${INVENTORY_GRPC_HOST}
    grpc-port: ${INVENTORY_GRPC_PORT:9093}
  finance:
    grpc-host: ${FINANCE_GRPC_HOST}
    grpc-port: ${FINANCE_GRPC_PORT:9094}
  mqtt:
    url: ${SMARTFARM_MQTT_URL}
    username: ${SMARTFARM_MQTT_USERNAME}
    password: ${SMARTFARM_MQTT_PASSWORD}
management:
  endpoint:
    health:
      show-details: never
