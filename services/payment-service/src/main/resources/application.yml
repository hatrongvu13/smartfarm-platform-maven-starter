spring:
  application:
    name: payment-service
  profiles:
    # Mặc định cứng = dev khi khởi chạy bình thường (mvn spring-boot:run / java -jar) mà không
    # cần set biến môi trường. Override bằng SPRING_PROFILES_ACTIVE=prod|test khi cần.
    active: ${SPRING_PROFILES_ACTIVE:dev}
server:
  port: 8084
  # SINGLE-INGRESS: internal service. Bind loopback only; the gateway is the sole public
  # ingress. Override FINANCE_BIND_ADDRESS only for a private cross-host mesh.
  address: ${FINANCE_BIND_ADDRESS:127.0.0.1}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint.health.probes.enabled: true
spring.grpc.server.port: 9094
farmverse:
  grpc:
    tls:
      enabled: false
      cert-chain: ${GRPC_CERT_CHAIN:}
      private-key: ${GRPC_PRIVATE_KEY:}
  security:

    authorization-invalidation:
      mqtt:
        enabled: ${AUTHORIZATION_INVALIDATION_MQTT_ENABLED:true}
        broker-url: ${FARMVERSE_MQTT_URL:tcp://localhost:1883}
        topic-filter: ${AUTHORIZATION_INVALIDATION_TOPIC_FILTER:farmverse/+/_global/domain/authorization-invalidated/v1}
        client-id: ${AUTHORIZATION_INVALIDATION_CLIENT_ID:${spring.application.name}-authorization-watermark-${HOSTNAME:local}}
        qos: ${AUTHORIZATION_INVALIDATION_QOS:1}
        username: ${FARMVERSE_MQTT_USERNAME:}
        password: ${FARMVERSE_MQTT_PASSWORD:}
    jwt:
      issuer: ${FARMVERSE_JWT_ISSUER:}
      jwk-set-uri: ${FARMVERSE_JWKS_URI:}
      audiences:
        - ${FARMVERSE_JWT_AUDIENCE:farmverse-finance}
      allow-local-http: false
    grpc:
      require-explicit-policy: true
      authorities:
        "[farmverse.finance.v1.FarmFinanceService/RecordExpense]": finance:write
        "[farmverse.finance.v1.FarmFinanceService/ReverseExpense]": finance:write
        "[farmverse.finance.v1.FarmFinanceService/RecordIncome]": finance:write
        "[farmverse.finance.v1.FarmFinanceService/GetTransaction]": finance:read
        "[farmverse.finance.v1.FarmFinanceService/ListTransactions]": finance:read
        "[farmverse.finance.v1.FarmFinanceService/RecordPayable]": finance:write
        "[farmverse.finance.v1.FarmFinanceService/RecordReceivable]": finance:write
        "[farmverse.finance.v1.FarmFinanceService/SettleDebt]": finance:write
        "[farmverse.finance.v1.FarmFinanceService/GetBatchCost]": finance:read
        "[farmverse.finance.v1.FarmFinanceService/GetCashFlow]": finance:read
  mqtt:
    url: ${MQTT_URL:tcp://localhost:1883}
