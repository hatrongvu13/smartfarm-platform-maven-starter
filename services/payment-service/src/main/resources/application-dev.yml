spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/farmverse
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # DEV strategy: Hibernate owns the schema for fast iteration (disposable dev DB).
      # Flyway is OFF in dev and reserved for TEST (reproducible) + PROD (validate). See
      # docs/refactor/DEV-DB-WORKFLOW.md.
      ddl-auto: update
  flyway:
    enabled: false
  h2.console.enabled: true
farmverse:
  security:
    jwt:
      issuer: http://localhost:8092
      jwk-set-uri: http://localhost:8092/.well-known/jwks.json
      audiences:
        - farmverse-finance
      allow-local-http: true
