spring:
  application:
    name: livestock-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Resource server chuẩn của Boot: tự kiểm chữ ký (JWKS), iss và aud.
          issuer-uri: ${IDENTITY_ISSUER:http://localhost:8092}
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8092/oauth2/jwks}
          audiences: farmverse-api
server:
  port: 8081
  address: ${LIVESTOCK_BIND_ADDRESS:127.0.0.1}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
