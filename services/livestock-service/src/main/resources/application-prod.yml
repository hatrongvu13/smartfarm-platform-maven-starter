spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IDENTITY_ISSUER}
          jwk-set-uri: ${IDENTITY_JWKS_URI}
  datasource:
    url: ${LIVESTOCK_DB_URL}
    username: ${LIVESTOCK_DB_USER}
    password: ${LIVESTOCK_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
farmverse:
  outbox:
    enabled: false
server:
  # SINGLE-HOST prod: HTTP bound to loopback (gateway is the sole ingress).
  address: ${LIVESTOCK_BIND_ADDRESS:127.0.0.1}
