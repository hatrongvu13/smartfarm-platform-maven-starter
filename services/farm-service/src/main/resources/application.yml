spring:
  application:
    name: farm-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    # mTLS bật ở dev và prod (xem application-mtls.yml); test bật riêng khi cần.
    group:
      dev: [ mtls ]
      prod: [ mtls ]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IDENTITY_ISSUER:http://localhost:8092}
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8092/oauth2/jwks}
          audiences: farmverse-api
server:
  port: 8082
  address: ${FARM_BIND_ADDRESS:127.0.0.1}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
