spring:
  application:
    name: farm-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    # mTLS: prod luôn bật. Dev mặc định TẮT; bật bằng SPRING_PROFILES_ACTIVE=dev,mtls
    # (cần chạy scripts/generate-dev-mtls.sh trước). Xem application-mtls.yml.
    group:
      prod: [ mtls ]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IDENTITY_ISSUER:http://localhost:8092}
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8092/oauth2/jwks}
          # Chỉ nhận token có aud chứa farm-service (ADR-0006). Lúc chuyển đổi có thể tạm đặt
          # FARM_ACCEPTED_AUDIENCES=farm-service,farmverse-api. Profile mtls dùng cùng danh sách (MtlsConfiguration).
          audiences: ${FARM_ACCEPTED_AUDIENCES:farm-service}
server:
  port: 8082
  address: ${FARM_BIND_ADDRESS:127.0.0.1}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
