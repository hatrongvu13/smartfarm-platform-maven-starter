spring:
  application:
    name: smartfarm-reporting-service
  profiles:
    # Mặc định cứng = dev khi khởi chạy bình thường (mvn spring-boot:run / java -jar) mà không
    # cần set biến môi trường. Override bằng SPRING_PROFILES_ACTIVE=prod|test khi cần.
    active: ${SPRING_PROFILES_ACTIVE:dev}
server:
  port: 8086
management:
  endpoints:
    web:
      exposure:
        include: health,info
spring.grpc.server.port: 9096
smartfarm:
  security:
    jwt:
      issuer: ${SMARTFARM_JWT_ISSUER:}
      jwk-set-uri: ${SMARTFARM_JWKS_URI:}
      audiences:
        - ${SMARTFARM_JWT_AUDIENCE:smartfarm-reporting}
      allow-local-http: false
  reporting:
    grpc:
      livestock-deadline: ${REPORTING_LIVESTOCK_GRPC_DEADLINE:10s}
    output-dir: ${REPORTING_OUTPUT_DIR:./.local/reports}
    download-ttl-seconds: ${REPORTING_DOWNLOAD_TTL:900}
    worker:
      enabled: true
      poll-ms: 5000
