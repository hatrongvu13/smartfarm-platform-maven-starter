spring:
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/smartfarm}
    username: ${IDENTITY_DB_USER:postgres}
    password: ${IDENTITY_DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
  sql:
    init:
      mode: never
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 0
logging:
  level:
    org.flywaydb: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
server:
  address: ${IDENTITY_BIND_ADDRESS:127.0.0.1}

smartfarm:
  security:
    jwt:
      issuer: ${IDENTITY_ISSUER:http://localhost:8092}
      jwk-set-uri: ${IDENTITY_JWK_SET_URI:http://localhost:8092/.well-known/jwks.json}
      audiences:
        - smartfarm-gateway
        - smartfarm-identity
      allow-local-http: true

  identity:
    issuer: ${IDENTITY_ISSUER:http://localhost:8092}
    private-key-path: ${IDENTITY_PRIVATE_KEY_PATH:classpath:.local/identity-private.pem}
    public-key-path: ${IDENTITY_PUBLIC_KEY_PATH:classpath:.local/identity-public.pem}
    bootstrap-password: ${IDENTITY_BOOTSTRAP_PASSWORD:replace-with-a-long-random-password}
    identity-audience: ${IDENTITY_AUDIENCE:smartfarm-identity}
    service-token:
      ttl: ${IDENTITY_SERVICE_TOKEN_TTL:5m}
      clients:
        gateway:
          secret: ${IDENTITY_GATEWAY_CLIENT_SECRET_HASH:$2a$12$YGIvX6qteWbknC9owzIGueP9fk7sgtyuOo9phPNEChG2TQ3UUuv1q}
          audiences:
            - smartfarm-identity
            - smartfarm-livestock
            - smartfarm-health
            - smartfarm-inventory
            - smartfarm-order
            - smartfarm-reporting
            - smartfarm-finance
          scopes-by-audience:
            smartfarm-identity:
              - identity:principal:read
              - identity:principal:update
              - identity:permission:check
              - identity:user:read
              - identity:user:create
              - identity:user:disable
              - identity:role:read
              - identity:role:assign
              - identity:permission:read
            smartfarm-livestock:
              - tasks:write
              - farm:read
            smartfarm-health:
              - farm:read
            smartfarm-inventory:
              - inventory:write
              - inventory:read
            smartfarm-order:
              - orders:write
              - orders:read
            smartfarm-reporting:
              - report:write
              - report:read
            smartfarm-finance:
              - finance:read
        order:
          secret: ${IDENTITY_ORDER_CLIENT_SECRET_HASH:$2a$12$Ya54/cTObYqqsalBT5HpkOszgwjCKbFeGwxxqVqPwuVkkqyxXpYSe}
          audiences:
            - smartfarm-inventory
            - smartfarm-finance
          scopes-by-audience:
            smartfarm-inventory:
              - inventory:write
              - inventory:read
            smartfarm-finance:
              - finance:write
        reporting:
          secret: ${IDENTITY_REPORTING_CLIENT_SECRET_HASH:$2a$12$jwPKV0PPruUEH24rIja3hu4yPatIvCt2l3y6Z48afeP5.3Zhkis1m}
          audiences:
            - smartfarm-livestock
          scopes-by-audience:
            smartfarm-livestock:
              - farm:read
    mfa:
      issuer: ${IDENTITY_MFA_ISSUER:SmartFarm}
      challenge-ttl: ${IDENTITY_MFA_CHALLENGE_TTL:5m}
      maximum-attempts: ${IDENTITY_MFA_MAXIMUM_ATTEMPTS:5}
      recovery-code-count: ${IDENTITY_MFA_RECOVERY_CODE_COUNT:10}
      encryption-key: ${IDENTITY_MFA_ENCRYPTION_KEY:GitxwqL/a1ALNdR0FxUvdaxNAwFi+BRxATfcvyI5P8k=}

