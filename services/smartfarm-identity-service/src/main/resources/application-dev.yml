spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/smartfarm
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema now; Hibernate only validates entities against it.
      ddl-auto: update
  flyway:
    enabled: true
    # DB may already contain tables from the earlier ddl-auto phase; baseline so V1 applies cleanly.
    baseline-on-migrate: true
    baseline-version: 0

# Identity is an INTERNAL service: bind to loopback so external clients cannot reach
# it directly. All external auth traffic must enter through the gateway (port 8080).
server:
  address: 127.0.0.1

smartfarm:
  identity:
    issuer: http://localhost:8092
    private-key-path: classpath:.local/identity-private.pem
    public-key-path: classpath:.local/identity-public.pem
    # Machine-to-machine (service) tokens — client-credentials flow (Hướng A).
    # DEV secret only; in prod inject a real secret hash via env and keep this out of VCS.
    service-token:
      ttl: 5m
      clients:
        gateway:
          # bcrypt("dev-gateway-service-secret"); dev-only, override in prod.
          secret: "$2a$12$YGIvX6qteWbknC9owzIGueP9fk7sgtyuOo9phPNEChG2TQ3UUuv1q"
          audiences:
            - smartfarm-livestock
            - smartfarm-health
            - smartfarm-inventory
            - smartfarm-order
            - smartfarm-reporting
            - smartfarm-finance
          scopes-by-audience:
            smartfarm-livestock:
              - "tasks:write"
              - "farm:read"
            smartfarm-health:
              - "farm:read"
            smartfarm-inventory:
              - "inventory:write"
              - "inventory:read"
            smartfarm-order:
              - "orders:write"
              - "orders:read"
            smartfarm-reporting:
              - "report:write"
              - "report:read"
            smartfarm-finance:
              - "finance:read"
        order:
          # bcrypt("dev-order-service-secret"); dev-only, override in prod.
          # The saga owner calls inventory (reserve/commit/release) and finance (record expense).
          secret: "$2a$12$Ya54/cTObYqqsalBT5HpkOszgwjCKbFeGwxxqVqPwuVkkqyxXpYSe"
          audiences:
            - smartfarm-inventory
            - smartfarm-finance
          scopes-by-audience:
            smartfarm-inventory:
              - "inventory:write"
              - "inventory:read"
            smartfarm-finance:
              - "finance:write"
        reporting:
          # bcrypt("dev-reporting-service-secret"); dev-only, override in prod.
          # Reporting pulls read-only data from source services to render reports.
          secret: "$2a$12$jwPKV0PPruUEH24rIja3hu4yPatIvCt2l3y6Z48afeP5.3Zhkis1m"
          audiences:
            - smartfarm-livestock
          scopes-by-audience:
            smartfarm-livestock:
              - "farm:read"