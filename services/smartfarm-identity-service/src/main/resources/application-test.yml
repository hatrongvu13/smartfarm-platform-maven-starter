# TEST profile — isolated, reproducible, in-memory. (refactor §5 / §19 / §20)
# H2 in PostgreSQL-compatibility mode; schema created fresh per run by Hibernate (create-drop
# is SAFE: in-memory DB, discarded on JVM exit). Flyway OFF in test. PROD remains Flyway +
# validate (application-prod.yml) backed by V1__identity_baseline.sql.
spring:
  datasource:
    url: jdbc:h2:mem:identity;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      mode: never
smartfarm:
  security:
    jwt:
      issuer: http://localhost:8092
      jwk-set-uri: http://localhost:8092/.well-known/jwks.json
      audiences:
        - smartfarm-gateway
        - smartfarm-identity
      allow-local-http: true
