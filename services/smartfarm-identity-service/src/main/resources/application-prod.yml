spring:
  datasource:
    url: ${IDENTITY_DB_URL}
    username: ${IDENTITY_DB_USER}
    password: ${IDENTITY_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

server:
  address: ${IDENTITY_BIND_ADDRESS:127.0.0.1}
# gRPC server bind address — loopback only in prod (gateway is the sole public ingress),
# mirroring finance/health. Port inherits 9092 from the base profile.
spring.grpc.server.address: ${IDENTITY_GRPC_BIND_ADDRESS:127.0.0.1}

smartfarm:
  security:
    jwt:
      issuer: ${IDENTITY_ISSUER}
      jwk-set-uri: ${IDENTITY_JWK_SET_URI}
      audiences:
        - smartfarm-gateway
        - smartfarm-identity
      allow-local-http: false
    # PROD: app-level MQTT message auth (HMAC-SHA256). Default OFF; rollout in docs/security/mqtt-acl-mtls.md.
    mqtt:
      sign-enabled: ${MQTT_SIGN_ENABLED:false}
      verify-enabled: ${MQTT_VERIFY_ENABLED:false}
      hmac-secret: ${MQTT_HMAC_SECRET:}
      key-id: ${MQTT_HMAC_KEY_ID:default}
      max-clock-skew-millis: ${MQTT_MAX_CLOCK_SKEW_MILLIS:0}

  identity:
    mqtt:
      enabled: ${IDENTITY_MQTT_ENABLED:true}
    issuer: ${IDENTITY_ISSUER}
    key-id: ${IDENTITY_KEY_ID}
    # Required by IdentitySettings (requireText). Was MISSING from the prod profile, so prod
    # failed to start with "identityAudience must not be blank" regardless of the schema.
    identity-audience: ${IDENTITY_AUDIENCE:smartfarm-identity}
    private-key-path: ${IDENTITY_PRIVATE_KEY_PATH}
    public-key-path: ${IDENTITY_PUBLIC_KEY_PATH}
    bootstrap-password: ${IDENTITY_BOOTSTRAP_PASSWORD:}
    service-token:
      ttl: ${IDENTITY_SERVICE_TOKEN_TTL:5m}
      clients: {}
