spring:
  application:
    name: smartfarm-identity-service
  profiles:
    # Mặc định cứng = dev khi khởi chạy bình thường (mvn spring-boot:run / java -jar) mà không
    # cần set biến môi trường. Override bằng SPRING_PROFILES_ACTIVE=prod|test khi cần.
    active: ${SPRING_PROFILES_ACTIVE:dev}
  sql:
    init:
      mode: always
server:
  port: 8092
  # SINGLE-INGRESS: identity is an INTERNAL service. Bind loopback only so no external host can
  # reach its REST (login/admin/service-token) directly — the gateway (same host) proxies all
  # public auth traffic. Override IDENTITY_BIND_ADDRESS only where identity and gateway run on
  # different hosts behind a private network / mesh with its own access controls.
  address: ${IDENTITY_BIND_ADDRESS:127.0.0.1}
# gRPC server: the gateway dials identity at 9092 (smartfarm.identity.grpc-port). Without this
# key spring-grpc never binds the identity gRPC server, so the gateway's getPrincipal /
# getSecurityProfile calls fail with UNAVAILABLE (Connection refused /127.0.0.1:9092).
spring.grpc.server.port: 9092
smartfarm:
  grpc:
    tls:
      enabled: false
      cert-chain: ${GRPC_CERT_CHAIN:}
      private-key: ${GRPC_PRIVATE_KEY:}
  identity:
    authorization:
      permission-sync:
        enabled: true
        update-existing: true
        permissions:
          # BEGIN AUTO-SYNC GATEWAY PERMISSIONS
          - code: "farm:read"
            resource-type: "farm"
            action: "read"
            description: "Allows read access to farm"
          - code: "health:read"
            resource-type: "health"
            action: "read"
            description: "Allows read access to health"
          - code: "identity:mfa:disable"
            resource-type: "identity-mfa"
            action: "disable"
            description: "Allows disable access to identity mfa"
          - code: "identity:mfa:enroll"
            resource-type: "identity-mfa"
            action: "enroll"
            description: "Allows enroll access to identity mfa"
          - code: "identity:mfa:recovery:regenerate"
            resource-type: "identity-mfa-recovery"
            action: "regenerate"
            description: "Allows regenerate access to identity mfa recovery"
          - code: "identity:permission:read"
            resource-type: "identity-permission"
            action: "read"
            description: "Allows read access to identity permission"
          - code: "identity:principal:read"
            resource-type: "identity-principal"
            action: "read"
            description: "Allows read access to identity principal"
          - code: "identity:principal:update"
            resource-type: "identity-principal"
            action: "update"
            description: "Allows update access to identity principal"
          - code: "identity:role:read"
            resource-type: "identity-role"
            action: "read"
            description: "Allows read access to identity role"
          - code: "identity:security:read"
            resource-type: "identity-security"
            action: "read"
            description: "Allows read access to identity security"
          - code: "identity:user:create"
            resource-type: "identity-user"
            action: "create"
            description: "Allows create access to identity user"
          - code: "identity:user:credential:reset"
            resource-type: "identity-user-credential"
            action: "reset"
            description: "Allows reset access to identity user credential"
          - code: "identity:user:mfa:reset"
            resource-type: "identity-user-mfa"
            action: "reset"
            description: "Allows reset access to identity user mfa"
          - code: "identity:user:read"
            resource-type: "identity-user"
            action: "read"
            description: "Allows read access to identity user"
          - code: "inventory:read"
            resource-type: "inventory"
            action: "read"
            description: "Allows read access to inventory"
          - code: "inventory:write"
            resource-type: "inventory"
            action: "write"
            description: "Allows write access to inventory"
          - code: "orders:read"
            resource-type: "orders"
            action: "read"
            description: "Allows read access to orders"
          - code: "orders:saga:admin"
            resource-type: "orders-saga"
            action: "admin"
            description: "Allows admin access to orders saga"
          - code: "orders:write"
            resource-type: "orders"
            action: "write"
            description: "Allows write access to orders"
          - code: "report:read"
            resource-type: "report"
            action: "read"
            description: "Allows read access to report"
          - code: "report:write"
            resource-type: "report"
            action: "write"
            description: "Allows write access to report"
          - code: "tasks:write"
            resource-type: "tasks"
            action: "write"
            description: "Allows write access to tasks"
          - code: "identity:permission:manage"
            resource-type: "identity-permission"
            action: "manage"
            description: "Allows manage access to identity permission"
          - code: "identity:role:assign"
            resource-type: "identity-role"
            action: "assign"
            description: "Allows assign access to identity role"
          - code: "identity:role:manage"
            resource-type: "identity-role"
            action: "manage"
            description: "Allows manage access to identity role"
          - code: "identity:user:disable"
            resource-type: "identity-user"
            action: "disable"
            description: "Allows disable access to identity user"
          - code: "identity:user:profile:manage"
            resource-type: "identity-user-profile"
            action: "manage"
            description: "Allows SUPERADMIN to update another user profile"
          - code: "identity:user:account:manage"
            resource-type: "identity-user-account"
            action: "manage"
            description: "Allows SUPERADMIN to disable, enable and unlock accounts"
          # END AUTO-SYNC GATEWAY PERMISSIONS
      role-sync:
        enabled: true
        roles:
          - code: USER
            name: User
            system-role: true
            permission-codes:
              - identity:principal:read
              - identity:principal:update
              - identity:security:read
              - identity:mfa:enroll
              - identity:mfa:disable
              - identity:mfa:recovery:regenerate
              - identity:user:credential:reset
              - farm:read
          - code: ADMIN
            name: Tenant Administrator
            system-role: true
            permission-codes:
              - identity:principal:read
              - identity:principal:update
              - identity:security:read
              - identity:user:read
              - identity:user:create
              - identity:user:disable
              - identity:user:mfa:reset
              - identity:role:read
              - identity:role:assign
              - identity:role:manage
              - identity:permission:read
              - identity:permission:manage
              - farm:read

    issuer: ${IDENTITY_ISSUER:http://localhost:8092}
    gateway-audience: smartfarm-gateway
    key-id: ${IDENTITY_KEY_ID:dev-key-1}
    access-ttl: 10m
    refresh-ttl: 7d
    max-failures: 5
    lock-duration: 15m
    public-registration: false
    registration-tenant: ${IDENTITY_REGISTRATION_TENANT:}
    bootstrap-tenant: ${IDENTITY_BOOTSTRAP_TENANT:farm-demo}
    bootstrap-email: ${IDENTITY_BOOTSTRAP_EMAIL:admin@example.test}
    bootstrap-password: ${IDENTITY_BOOTSTRAP_PASSWORD:replace-with-a-long-random-password}
    # Machine-to-machine service tokens. Default has NO clients — a profile (dev/prod)
    # must whitelist each caller before any service token can be minted.

    mqtt:
      enabled: ${IDENTITY_MQTT_ENABLED:true}
      broker-uri: ${IDENTITY_MQTT_URL:tcp://localhost:1883}
      client-id: ${IDENTITY_MQTT_CLIENT_ID:smartfarm-identity-service}
      username: ${IDENTITY_MQTT_USERNAME:}
      password: ${IDENTITY_MQTT_PASSWORD:}
      qos: ${IDENTITY_MQTT_QOS:1}
      clean-session: false
      connection-timeout: 10s
      keep-alive: 15s
      initial-retry: 5s
      maximum-fast-retry: 15s
      degraded-after-attempts: 30
      degraded-retry: 60s
      probe-after: 10m
      probe-interval: 5m

      commands:
        enabled: ${IDENTITY_MQTT_COMMANDS_ENABLED:false}
        topic-filter: ${IDENTITY_MQTT_COMMAND_TOPIC_FILTER:smartfarm/+/identity/command/+/v1}
        qos: ${IDENTITY_MQTT_COMMAND_QOS:1}
        maximum-payload-bytes: ${IDENTITY_MQTT_COMMAND_MAXIMUM_PAYLOAD_BYTES:65536}
        allowed-types:
          - identity.membership.enable
          - identity.membership.suspend
          - identity.membership.disable
          - identity.role.assign
          - identity.role.revoke
        retention: ${IDENTITY_MQTT_COMMAND_RETENTION:30d}
        cleanup-interval: ${IDENTITY_MQTT_COMMAND_CLEANUP_INTERVAL:1h}
        dispatch-interval: ${IDENTITY_MQTT_COMMAND_DISPATCH_INTERVAL:1s}
        dispatch-batch-size: ${IDENTITY_MQTT_COMMAND_DISPATCH_BATCH_SIZE:25}
        maximum-attempts: ${IDENTITY_MQTT_COMMAND_MAXIMUM_ATTEMPTS:5}
        initial-retry: ${IDENTITY_MQTT_COMMAND_INITIAL_RETRY:5s}
        maximum-retry: ${IDENTITY_MQTT_COMMAND_MAXIMUM_RETRY:5m}
        processing-timeout: ${IDENTITY_MQTT_COMMAND_PROCESSING_TIMEOUT:2m}

    outbox:
      enabled: ${IDENTITY_OUTBOX_ENABLED:true}
      batch-size: ${IDENTITY_OUTBOX_BATCH_SIZE:50}
      poll-interval: ${IDENTITY_OUTBOX_POLL_INTERVAL:2s}
      maximum-attempts: ${IDENTITY_OUTBOX_MAXIMUM_ATTEMPTS:12}
      initial-retry: ${IDENTITY_OUTBOX_INITIAL_RETRY:5s}
      maximum-retry: ${IDENTITY_OUTBOX_MAXIMUM_RETRY:5m}
      publishing-timeout: ${IDENTITY_OUTBOX_PUBLISHING_TIMEOUT:2m}
      published-retention: ${IDENTITY_OUTBOX_PUBLISHED_RETENTION:7d}
      cleanup-interval: ${IDENTITY_OUTBOX_CLEANUP_INTERVAL:1h}
    service-token:
      ttl: ${IDENTITY_SERVICE_TOKEN_TTL:5m}
      clients: {}
management:
  endpoints:
    web:
      exposure:
        include: health,info
