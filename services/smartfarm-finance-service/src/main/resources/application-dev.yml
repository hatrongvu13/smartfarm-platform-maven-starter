spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/smartfarm
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema now; Hibernate only validates entities against it.
      ddl-auto: update
  flyway:
    enabled: true
    # DB may already contain tables from the earlier ddl-auto phase; baseline so V1 applies cleanly.
    baseline-on-migrate: true
    baseline-version: 0
  h2.console.enabled: true
smartfarm:
  security:
    issuer: http://localhost:8092
    jwk-set-uri: http://localhost:8092/.well-known/jwks.json
    audience: smartfarm-finance
    allow-local-http: true
