spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartfarm}
    username: ${DB_USERNAME:smartfarm}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema in prod; Hibernate only validates entities against it.
      # (was create-drop, which dropped and recreated the finance schema on every restart)
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
