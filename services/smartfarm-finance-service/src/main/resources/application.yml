spring:
  application:
    name: smartfarm-finance-service
  profiles:
    # Mặc định cứng = dev khi khởi chạy bình thường (mvn spring-boot:run / java -jar) mà không
    # cần set biến môi trường. Override bằng SPRING_PROFILES_ACTIVE=prod|test khi cần.
    active: ${SPRING_PROFILES_ACTIVE:dev}
server:
  port: 8084
  # SINGLE-INGRESS: internal service. Bind loopback only; the gateway is the sole public
  # ingress. Override FINANCE_BIND_ADDRESS only for a private cross-host mesh.
  address: ${FINANCE_BIND_ADDRESS:127.0.0.1}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint.health.probes.enabled: true
spring.grpc.server.port: 9094
smartfarm:
  grpc:
    tls:
      enabled: false
      cert-chain: ${GRPC_CERT_CHAIN:}
      private-key: ${GRPC_PRIVATE_KEY:}
  security:
    jwt:
      issuer: ${SMARTFARM_JWT_ISSUER:}
      jwk-set-uri: ${SMARTFARM_JWKS_URI:}
      audiences:
        - ${SMARTFARM_JWT_AUDIENCE:smartfarm-finance}
      allow-local-http: false
  mqtt:
    url: ${MQTT_URL:tcp://localhost:1883}
