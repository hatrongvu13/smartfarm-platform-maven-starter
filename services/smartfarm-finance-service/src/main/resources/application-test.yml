# TEST profile — isolated, reproducible, in-memory. (refactor §5 / §19 / §20)
# No dependency on a developer's local PostgreSQL. H2 in PostgreSQL-compatibility mode,
# schema created fresh per run by Hibernate (create-drop is SAFE here: the DB is in-memory
# and discarded when the JVM exits). Flyway is OFF in test — the test DB is disposable, not
# a migrated environment. PROD remains Flyway + validate (see application-prod.yml).
spring:
  datasource:
    url: jdbc:h2:mem:finance;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
smartfarm:
  security:
    issuer: http://localhost:8092
    jwk-set-uri: http://localhost:8092/.well-known/jwks.json
    audience: smartfarm-finance
    allow-local-http: true
