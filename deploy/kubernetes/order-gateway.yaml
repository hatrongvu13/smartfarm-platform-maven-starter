apiVersion: v1
kind: Service
metadata: { name: farmverse-order }
spec:
  selector: { app: farmverse-order }
  ports:
    - { name: http, port: 8085, targetPort: http }
    - { name: grpc, port: 9095, targetPort: grpc }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: farmverse-order }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: farmverse-order } }
  template:
    metadata: { labels: { app: farmverse-order } }
    spec:
      terminationGracePeriodSeconds: 45
      securityContext: { runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: order
          image: ghcr.io/OWNER/REPOSITORY/farmverse-order:REPLACE_WITH_DIGEST
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8085 }, { name: grpc, containerPort: 9095 }]
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: prod }
            - { name: SERVER_PORT, value: "8085" }
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: ORDER_READMODEL_CLIENT_ID, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: ORDER_PROJECTION_GAP_RECOVERY_INSTANCE_ID, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          envFrom:
            - configMapRef: { name: farmverse-order-config }
            - secretRef: { name: farmverse-order-secrets }
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: http }, failureThreshold: 30, periodSeconds: 5, timeoutSeconds: 3 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3 }
          lifecycle: { preStop: { exec: { command: ["sh", "-c", "sleep 5"] } } }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp/farmverse }, { name: logs, mountPath: /var/log/farmverse }]
      volumes: [{ name: tmp, emptyDir: {} }, { name: logs, emptyDir: {} }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: farmverse-order }
spec: { minAvailable: 1, selector: { matchLabels: { app: farmverse-order } } }
---
apiVersion: v1
kind: Service
metadata: { name: api-gateway }
spec: { selector: { app: api-gateway }, ports: [{ name: http, port: 8080, targetPort: http }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api-gateway }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      terminationGracePeriodSeconds: 45
      securityContext: { runAsNonRoot: true, runAsUser: 1001, runAsGroup: 1001, fsGroup: 1001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: gateway
          image: ghcr.io/OWNER/REPOSITORY/api-gateway:REPLACE_WITH_DIGEST
          ports: [{ name: http, containerPort: 8080 }]
          env: [{ name: SPRING_PROFILES_ACTIVE, value: prod }, { name: SERVER_PORT, value: "8080" }]
          envFrom: [{ configMapRef: { name: api-gateway-config } }, { secretRef: { name: api-gateway-secrets } }]
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: http }, failureThreshold: 30, periodSeconds: 5, timeoutSeconds: 3 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, periodSeconds: 10, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, periodSeconds: 20, timeoutSeconds: 3 }
          lifecycle: { preStop: { exec: { command: ["sh", "-c", "sleep 5"] } } }
          resources: { requests: { cpu: 200m, memory: 384Mi }, limits: { cpu: "1", memory: 768Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp/farmverse }, { name: logs, mountPath: /var/log/farmverse }]
      volumes: [{ name: tmp, emptyDir: {} }, { name: logs, emptyDir: {} }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api-gateway }
spec: { minAvailable: 1, selector: { matchLabels: { app: api-gateway } } }
