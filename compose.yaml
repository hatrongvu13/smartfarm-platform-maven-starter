# FarmVerse — hạ tầng dev. Các service chạy trên máy (mvn spring-boot:run), không chạy trong compose.
# Mọi cổng chỉ mở trên 127.0.0.1.
services:
  # Mỗi service một database: farmverse_identity, farmverse_farm (tạo bởi infra/postgres-init.sql).
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports: [ "5432:5432" ]
    volumes:
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Session BFF của gateway (chứa token) + rate limit.
  redis:
    image: redis:8-alpine
    command: [ "redis-server", "--requirepass", "farmverse-dev" ]
    ports: [ "6379:6379" ]
