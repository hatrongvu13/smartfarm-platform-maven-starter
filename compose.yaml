# FarmVerse — hạ tầng dev. Các service chạy trên máy (mvn spring-boot:run), không chạy trong compose.
# Mọi cổng chỉ mở trên 127.0.0.1.
services:
  # Mỗi service một database và hai vai trò (<svc>_owner cho Flyway, <svc>_app cho ứng dụng), tạo bởi
  # infra/postgres-init.sh. Volume đã có từ trước M4: chạy lại script (idempotent), không cần xóa dữ liệu:
  #   docker compose exec -T postgres bash < infra/postgres-init.sh
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root            # superuser, chỉ để quản trị; service không dùng
      # Cùng tên biến với service; mặc định dev nằm trong script và application-dev.yml
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity-app-dev}
      IDENTITY_DB_MIGRATION_PASSWORD: ${IDENTITY_DB_MIGRATION_PASSWORD:-identity-owner-dev}
      FARM_DB_PASSWORD: ${FARM_DB_PASSWORD:-farm-app-dev}
      FARM_DB_MIGRATION_PASSWORD: ${FARM_DB_MIGRATION_PASSWORD:-farm-owner-dev}
    ports: [ "127.0.0.1:5432:5432" ]
    volumes:
      - ./infra/postgres-init.sh:/docker-entrypoint-initdb.d/01-farmverse.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Session BFF của gateway (chứa access/refresh token) + rate limit: luôn có mật khẩu.
  # Mật khẩu dùng chung biến REDIS_PASSWORD với gateway (mặc định dev: farmverse-dev).
  redis:
    image: redis:8-alpine
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD:-farmverse-dev}" ]
    ports: [ "127.0.0.1:6379:6379" ]
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-farmverse-dev}\" --no-auth-warning ping | grep -q PONG" ]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-farmverse-dev}
