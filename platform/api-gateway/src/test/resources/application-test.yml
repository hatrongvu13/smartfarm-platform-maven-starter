# Profile test của gateway. Cổng quản trị ngẫu nhiên để test chạy song song không giẫm cổng 9080.
# Đặt qua biến (không đặt thẳng management.server.port) để test kiểm luôn cách application.yml nối biến.
GATEWAY_MANAGEMENT_PORT: 0

# Các test đăng nhập dùng chung context (cùng IP 127.0.0.1): giới hạn cao để không chặn nhau.
# Hành vi giới hạn được kiểm riêng ở LoginRateLimitFilterTest và GatewayRedisIT.
farmverse:
  gateway:
    login-rate-limit:
      max-attempts: 1000
