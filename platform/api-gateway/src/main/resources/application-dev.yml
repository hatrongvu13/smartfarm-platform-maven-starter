# DEV — mở trình duyệt ở http://127.0.0.1:8080 (SAS không nhận redirect về host "localhost").
farmverse:
  gateway:
    oidc:
      client-secret: ${GATEWAY_CLIENT_SECRET:dev-gateway-secret-change-me-0123456789}
    headers:
      # Vite dev server cần: script nhúng (preamble React Refresh), style nhúng (CSS chèn qua JS),
      # websocket HMR qua gateway :8080. Bản build prod không cần các thứ này (xem application.yml).
      content-security-policy: >-
        default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:; font-src 'self';
        connect-src 'self' ws://127.0.0.1:8080 ws://localhost:8080;
        object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self' {identity-origin}
spring:
  data:
    redis:
      password: ${REDIS_PASSWORD:farmverse-dev}
