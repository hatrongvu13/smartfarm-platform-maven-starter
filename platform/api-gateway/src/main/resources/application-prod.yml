# PROD — bí mật lấy từ biến môi trường; cookie chỉ qua HTTPS.
spring:
  security:
    oauth2:
      client:
        provider:
          farmverse:
            issuer-uri: ${IDENTITY_ISSUER}
  data:
    redis:
      ssl:
        enabled: ${REDIS_SSL:true}
farmverse:
  gateway:
    secure-cookie: true
