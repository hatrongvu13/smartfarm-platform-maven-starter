spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    # mTLS: prod luôn bật. Dev mặc định TẮT; bật bằng SPRING_PROFILES_ACTIVE=dev,mtls
    # (cần chạy scripts/generate-dev-mtls.sh trước). Xem application-mtls.yml.
    group:
      prod: [ mtls ]

  # M7: chuyển context của Reactor (trace hiện tại) sang MDC trên mọi luồng, để log của gateway có traceId/spanId.
  reactor:
    context-propagation: auto

  # Redis giữ session (có access/refresh token) và bộ đếm rate limit: tài sản nhạy cảm.
  # Timeout ngắn để Redis treo không giữ request vô hạn; Redis lỗi thì request có phiên nhận 503
  # (RedisUnavailableHandler), không bao giờ được cho qua.
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # ACL user (prod): đặt SPRING_DATA_REDIS_USERNAME. Không khai ở đây vì chuỗi rỗng có thể bị gửi
      # thành "AUTH '' <mật khẩu>" và Redis từ chối.
      password: ${REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT:2s}          # thời gian chờ một lệnh
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}

  # Phiên BFF: hết hạn sau thời gian không hoạt động; key riêng để không lẫn với ứng dụng khác dùng chung Redis.
  session:
    timeout: ${GATEWAY_SESSION_TIMEOUT:30m}
    data:
      redis:
        namespace: farmverse:gateway:session

  cloud:
    gateway:
      server:
        webflux:
          # Mọi route, mọi profile: không chờ service phía sau vô hạn. Quá hạn → 504, không kết nối được → 502
          # (DownstreamErrorHandler). Trước đây chỉ có ở profile mtls.
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:3000}     # mili giây
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}
          default-filters:
            - SaveSession   # lưu session (có token mới refresh) trước khi chuyển request xuống service
            # Cookie của trình duyệt (FV_SESSION, XSRF-TOKEN) chỉ dành cho gateway. Service xác thực bằng token
            # (TokenRelay), SPA là file tĩnh: không ai phía sau cần cookie, nên không chuyển để nó không lọt vào log
            # hay tay service khác (M7, T16).
            - RemoveRequestHeader=Cookie
          routes:
            # CircuitBreaker đứng CUỐI danh sách: chỉ bọc lời gọi xuống service, không đếm lỗi của TokenRelay
            # (refresh với identity) hay rate limiter. Mỗi route một breaker (G3, CircuitBreakerConfiguration).
            - id: identity-api
              uri: ${farmverse.gateway.routes.identity-uri}
              predicates: [ "Path=/api/identity/**" ]
              filters:
                - StripPrefix=2
                - TokenRelay=
                - &rate-limit
                  name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
                - CircuitBreaker=identity
            - id: farm-api
              uri: ${farmverse.gateway.routes.farm-uri}
              predicates: [ "Path=/api/farm/**" ]
              filters:
                - StripPrefix=2
                - TokenRelay=
                - *rate-limit
                - CircuitBreaker=farm
            # Mọi đường còn lại là trang web (SPA): một origin duy nhất cho trình duyệt.
            - id: web
              uri: ${WEB_URL:http://localhost:5173}
              predicates: [ "Path=/**" ]
              order: 1000

    # G3: time limiter của Resilience4j tắt; quá hạn chỉ do httpclient.response-timeout ở trên quyết định
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true

# ---- Gateway là OIDC client của identity (xem GatewayOidcProperties) ----
farmverse:
  gateway:
    # Header bảo mật (SecurityConfiguration#securityHeaders). CSP này dành cho bản build của SPA: chỉ tài nguyên
    # cùng origin, không script/style nhúng. {identity-origin} được thay bằng origin của issuer (đích redirect
    # khi đăng xuất). Dev ghi đè trong application-dev.yml cho Vite.
    # IP/CIDR của edge TLS (load balancer, ingress) được tin header X-Forwarded-*/Forwarded, cách nhau bằng dấu phẩy.
    # Rỗng = không tin ai. Prod phải đặt, nếu không redirect_uri OIDC thành http://<máy nội bộ> và đăng nhập hỏng.
    trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}
    headers:
      content-security-policy: >-
        default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:;
        font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self';
        frame-ancestors 'none'; form-action 'self' {identity-origin}
      hsts: false
    oidc:
      issuer: ${IDENTITY_ISSUER:http://localhost:8092}
      client-id: farmverse-gateway
      client-secret: ${GATEWAY_CLIENT_SECRET}
      scopes: openid,profile,email,farmverse.api
    routes:
      identity-uri: ${IDENTITY_URL:http://localhost:8092}
      farm-uri: ${FARM_URL:http://localhost:8082}

server:
  port: 8080
  address: ${GATEWAY_BIND_ADDRESS:127.0.0.1}
  # Không để Reactor Netty tự đọc X-Forwarded-* (chế độ native tin mọi nguồn; Boot tự bật nó trên Kubernetes).
  # Header forwarded chỉ được dùng khi đến từ farmverse.gateway.trusted-proxies (TrustedProxyForwardedHeaderTransformer).
  forward-headers-strategy: none

# Actuator ở cổng quản trị riêng, chỉ loopback, không TLS (giống identity :9092, farm :9082).
# Cổng công khai 8080 không có /actuator/** (ADR-0008). Probe: /actuator/health/{liveness,readiness}.
# Endpoint "gateway" (liệt kê route + URI nội bộ) cố ý không bật; debug cục bộ thì tự thêm vào exposure.
management:
  server:
    port: ${GATEWAY_MANAGEMENT_PORT:9080}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        # prometheus (M7): metric để scrape, cũng chỉ ở cổng quản trị loopback
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  # M7 (ADR-0012): trace W3C (traceparent) qua gateway tới service; traceId/spanId vào MDC của log.
  # Xuất OTLP chỉ khi đặt MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT (ví dụ http://otel-collector:4318/v1/traces).
  # Chỉ W3C. Tắt baggage ở cả ba service: header "baggage" do client gửi không được đọc vào context/MDC.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
    baggage:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

# M7, T16: hai logger này ở mức DEBUG in bí mật, nên giữ ở INFO kể cả khi bật DEBUG cho cả package
# (cấu hình logger cụ thể thắng cấu hình package). Đã kiểm ở GatewayObservabilityTest.
#  - ObservedRequest/ResponseHttpHeadersFilter: in mọi header (Cookie, Authorization, X-XSRF-TOKEN, Set-Cookie).
#  - HttpWebHandlerAdapter: in URL kèm query, gồm cả ?code= của callback OAuth2.
logging:
  level:
    org.springframework.cloud.gateway.filter.headers.observation: INFO
    org.springframework.web.server.adapter.HttpWebHandlerAdapter: INFO
