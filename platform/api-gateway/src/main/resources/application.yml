spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    group:
      dev: [ mtls ]
      prod: [ mtls ]

  # mTLS bật ở dev và prod (application-mtls.yml); test chạy không TLS.
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - SaveSession   # lưu session (có token mới refresh) trước khi chuyển request xuống service
          routes:
            - id: identity-api
              uri: ${farmverse.gateway.routes.identity-uri}
              predicates: [ "Path=/api/identity/**" ]
              filters: &api-filters
                - StripPrefix=2
                - TokenRelay=
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
            - id: farm-api
              uri: ${farmverse.gateway.routes.farm-uri}
              predicates: [ "Path=/api/farm/**" ]
              filters: *api-filters
            # Mọi đường còn lại là trang web (SPA): một origin duy nhất cho trình duyệt.
            - id: web
              uri: ${WEB_URL:http://localhost:5173}
              predicates: [ "Path=/**" ]
              order: 1000

# ---- Gateway là OIDC client của identity (xem GatewayOidcProperties) ----
farmverse:
  gateway:
    oidc:
      issuer: ${IDENTITY_ISSUER:http://localhost:8092}
      client-id: farmverse-gateway
      client-secret: ${GATEWAY_CLIENT_SECRET}
      scopes: openid,profile,email,farmverse.api
    routes:
      identity-uri: ${IDENTITY_URL:http://localhost:8092}
      farm-uri: ${FARM_URL:http://localhost:8082}

server:
  port: 8080
  address: ${GATEWAY_BIND_ADDRESS:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
