spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # ---- Đăng nhập OIDC với identity-service (gateway là confidential client) ----
  security:
    oauth2:
      client:
        registration:
          farmverse:
            provider: farmverse
            client-id: farmverse-gateway
            client-secret: ${GATEWAY_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email,farmverse.api
        # provider.farmverse.issuer-uri khai theo profile (dev/prod). Discovery chạy lúc khởi động:
        # identity-service phải chạy trước gateway.

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - SaveSession   # lưu session (có token mới refresh) trước khi chuyển request xuống service
          routes:
            - id: identity-api
              uri: ${IDENTITY_URL:http://localhost:8092}
              predicates: [ "Path=/api/identity/**" ]
              filters: &api-filters
                - StripPrefix=2
                - TokenRelay=
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40
            - id: livestock-api
              uri: ${LIVESTOCK_URL:http://localhost:8081}
              predicates: [ "Path=/api/livestock/**" ]
              filters: *api-filters
            # Mọi đường còn lại là trang web (SPA): một origin duy nhất cho trình duyệt.
            - id: web
              uri: ${WEB_URL:http://localhost:5173}
              predicates: [ "Path=/**" ]
              order: 1000

server:
  port: 8080
  address: ${GATEWAY_BIND_ADDRESS:127.0.0.1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
